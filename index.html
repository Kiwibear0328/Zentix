<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZENTIX - ABILITY WAR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:white;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#142544 0%,#080d19 48%,#03050a 100%)}
.logo{font-size:clamp(48px,12vw,100px);font-weight:1000;letter-spacing:12px;color:#fff;text-shadow:0 0 22px #267bff,0 0 65px #1458c9}
.subtitle{letter-spacing:8px;color:#77aaff;margin-top:5px;font-size:13px}
#start{margin-top:55px;padding:17px 55px;border:1px solid #579aff;border-radius:9px;background:linear-gradient(135deg,#267bff,#1244a9);color:white;font-size:19px;font-weight:bold;cursor:pointer;box-shadow:0 0 30px #176bff66}
#start:active{transform:scale(.96)}
#loading{margin-top:18px;color:#8294b5;font-size:12px}
#hud{display:none;position:fixed;inset:0;z-index:3;pointer-events:none}
#top{position:absolute;top:17px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}
.panel{background:#080e1dcc;border:1px solid #42659a66;border-radius:10px;padding:10px 14px;backdrop-filter:blur(8px)}
#stats{font-size:13px;line-height:1.8}
#healthWrap{width:190px;height:9px;background:#303747;border-radius:20px;overflow:hidden;margin-top:5px}
#health{height:100%;width:100%;background:linear-gradient(90deg,#18d58c,#83f3c0);transition:width .2s}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#cce4ff;text-shadow:0 0 8px #4d9cff}
#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;color:#b8c9e8;text-align:center;white-space:nowrap}
#skills{position:absolute;right:20px;bottom:25px;display:flex;gap:9px;pointer-events:auto}
.skill{width:58px;height:58px;border:1px solid #5495ff;border-radius:12px;background:#101e38dd;color:white;font-weight:bold;font-size:17px;box-shadow:0 0 15px #267bff33;touch-action:manipulation}
.skill small{display:block;font-size:9px;color:#9bbcff;margin-top:3px}
#mobilePad{display:none;position:absolute;left:22px;bottom:30px;width:120px;height:120px;border:1px solid #7daeff66;border-radius:50%;background:#17345a55;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#6caaffaa;border:1px solid #b5d5ff}
#lookArea{display:none;position:absolute;right:0;top:15%;width:55%;height:65%;pointer-events:auto;touch-action:none}
#gameOver{display:none;position:fixed;z-index:12;inset:0;background:#030711eF;align-items:center;justify-content:center;flex-direction:column}
#gameOver h1{font-size:48px;color:#ff526b}
#again{padding:14px 35px;background:#246fff;border:0;border-radius:8px;color:white;font-size:17px;font-weight:bold}
#error{display:none;position:fixed;z-index:30;left:10px;right:10px;bottom:10px;padding:14px;background:#591b26;color:white;border:1px solid #ff6a7c;border-radius:8px;font-size:12px;white-space:pre-wrap}
@media(max-width:700px){
 #top{top:9px;left:9px;right:9px}
 .panel{padding:7px 9px}
 #healthWrap{width:125px}
 #skills{right:10px;bottom:18px;gap:5px}
 .skill{width:49px;height:52px;font-size:15px}
 #mobilePad{display:block}
 #lookArea{display:block}
 #hint{bottom:145px;font-size:10px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="menu">
  <div class="logo">ZENTIX</div>
  <div class="subtitle">ABILITY WAR</div>
  <button id="start" type="button">전투 시작</button>
  <div id="loading">READY TO FIGHT</div>
</div>

<div id="hud">
  <div id="top">
    <div class="panel" id="stats">
      <div>LEVEL <b id="level">1</b>　KILLS <b id="kills">0</b></div>
      <div>HP <b id="hpText">100</b> / 100</div>
      <div id="healthWrap"><div id="health"></div></div>
    </div>
    <div class="panel">ZENTIX <span style="color:#6baaff">● ONLINE</span></div>
  </div>
  <div id="crosshair">+</div>
  <div id="hint">WASD 이동 · 마우스 시점 · 클릭 공격 · Q E F R 스킬</div>
  <div id="skills">
    <button class="skill" data-skill="q">Q<small>발도술</small></button>
    <button class="skill" data-skill="e">E<small>회전참</small></button>
    <button class="skill" data-skill="f">F<small>비검</small></button>
    <button class="skill" data-skill="r">R<small>낙화천풍</small></button>
  </div>
  <div id="mobilePad"><div id="stick"></div></div>
  <div id="lookArea"></div>
</div>

<div id="gameOver">
  <h1>GAME OVER</h1>
  <p>전투가 종료되었습니다.</p>
  <button id="again">다시 시작</button>
</div>
<div id="error"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const errorBox = $('error');

function showError(message){
  errorBox.style.display='block';
  errorBox.textContent='게임 실행 오류\\n'+message;
}

window.addEventListener('error', e => {
  showError(e.message || '알 수 없는 오류');
});

if(!window.THREE){
  showError('Three.js를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.');
  $('loading').textContent='라이브러리 로딩 실패';
  return;
}

let scene,camera,renderer,clock;
let started=false,dead=false;
let yaw=0,pitch=0;
let health=100,kills=0,level=1;
let enemies=[],particles=[],projectiles=[];
let lastAttack=0,lastSkill={q:0,e:0,f:0,r:0};
let spawnTimer=0,damageFlash=0;
const keys={};
const mobile={x:0,y:0,lookX:0,lookY:0};
const player={position:new THREE.Vector3(0,1.7,8),speed:6};
const tempForward=new THREE.Vector3();
const tempRight=new THREE.Vector3();

try{
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x070c18);
  scene.fog=new THREE.Fog(0x070c18,25,75);

  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
  camera.position.copy(player.position);
  camera.rotation.order='YXZ';

  renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  $('game').appendChild(renderer.domElement);

  clock=new THREE.Clock();

  scene.add(new THREE.HemisphereLight(0x9fcaff,0x15182b,1.5));
  const sun=new THREE.DirectionalLight(0xffffff,1.3);
  sun.position.set(-8,15,8);
  scene.add(sun);

  // 바닥과 경기장
  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({color:0x101827,roughness:.9})
  );
  floor.rotation.x=-Math.PI/2;
  floor.position.y=-.06;
  scene.add(floor);

  const grid=new THREE.GridHelper(100,50,0x24518c,0x182a45);
  grid.position.y=-.045;
  scene.add(grid);

  const wallMat=new THREE.MeshStandardMaterial({color:0x17243b,metalness:.45,roughness:.6});
  function box(x,y,z,sx,sy,sz,mat=wallMat){
    const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
    m.position.set(x,y,z);scene.add(m);return m;
  }
  box(0,3,-32,64,6,1);
  box(0,3,32,64,6,1);
  box(-32,3,0,1,6,64);
  box(32,3,0,1,6,64);

  const pillarMat=new THREE.MeshStandardMaterial({color:0x263d60,metalness:.5,roughness:.45});
  for(let x of [-20,-10,10,20]){
    for(let z of [-20,0,20]){
      const p=new THREE.Mesh(new THREE.CylinderGeometry(.7,.9,5,8),pillarMat);
      p.position.set(x,2.5,z);scene.add(p);
      const light=new THREE.PointLight(0x287cff,1.2,9);
      light.position.set(x,4.8,z);scene.add(light);
    }
  }

  // 플레이어 검
  const weapon=new THREE.Group();
  camera.add(weapon);
  weapon.position.set(.48,-.42,-.8);

  const grip=new THREE.Mesh(
    new THREE.CylinderGeometry(.045,.05,.38,8),
    new THREE.MeshStandardMaterial({color:0x171a25})
  );
  grip.rotation.z=-.15;grip.position.y=-.12;weapon.add(grip);

  const guard=new THREE.Mesh(
    new THREE.TorusGeometry(.12,.025,6,16),
    new THREE.MeshStandardMaterial({color:0x9ba8c1,metalness:.8})
  );
  guard.position.y=.09;weapon.add(guard);

  const blade=new THREE.Mesh(
    new THREE.BoxGeometry(.055,.95,.035),
    new THREE.MeshStandardMaterial({color:0xdcecff,metalness:.8,roughness:.2})
  );
  blade.position.y=.58;weapon.add(blade);

  const bladeLine=new THREE.Mesh(
    new THREE.BoxGeometry(.012,.9,.008),
    new THREE.MeshBasicMaterial({color:0x65baff})
  );
  bladeLine.position.set(.02,.58,-.022);weapon.add(bladeLine);

  function makeEnemy(){
    const group=new THREE.Group();
    const bodyMat=new THREE.MeshStandardMaterial({color:0x9d2845,roughness:.65});
    const darkMat=new THREE.MeshStandardMaterial({color:0x251b2a});
    const body=new THREE.Mesh(new THREE.CylinderGeometry(.42,.52,1.25,8),bodyMat);
    body.position.y=.85;group.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.34,10,8),darkMat);
    head.position.y=1.7;group.add(head);
    const eyeMat=new THREE.MeshBasicMaterial({color:0xff526c});
    for(let side of [-1,1]){
      const eye=new THREE.Mesh(new THREE.SphereGeometry(.055,6,6),eyeMat);
      eye.position.set(side*.13,1.73,-.29);group.add(eye);
    }
    const glow=new THREE.PointLight(0xff174f,.7,3);
    glow.position.y=1.3;group.add(glow);
    scene.add(group);
    return {mesh:group,hp:3,speed:1.8+Math.random()*.7,attack:0};
  }

  function spawnEnemy(){
    if(enemies.length>=22)return;
    const e=makeEnemy();
    const a=Math.random()*Math.PI*2;
    const r=17+Math.random()*8;
    e.mesh.position.set(
      Math.cos(a)*r,0,
      Math.sin(a)*r
    );
    enemies.push(e);
  }

  function particle(position,color=0x68aaff,count=8){
    for(let i=0;i<count;i++){
      const mesh=new THREE.Mesh(
        new THREE.SphereGeometry(.045+Math.random()*.045,5,5),
        new THREE.MeshBasicMaterial({color})
      );
      mesh.position.copy(position);
      scene.add(mesh);
      particles.push({
        mesh,
        velocity:new THREE.Vector3(
          (Math.random()-.5)*5,
          Math.random()*4,
          (Math.random()-.5)*5
        ),
        life:.45+Math.random()*.4
      });
    }
  }

  function slashEffect(color=0x69baff,size=1){
    const arc=new THREE.Mesh(
      new THREE.TorusGeometry(1.3*size,.055,6,28,Math.PI*1.25),
      new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9})
    );
    arc.position.copy(camera.position);
    arc.position.add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(2));
    arc.quaternion.copy(camera.quaternion);
    scene.add(arc);
    particles.push({
      mesh:arc,velocity:new THREE.Vector3(0,0,0),life:.22,arc:true
    });
  }

  function damageEnemy(enemy,amount){
    if(!enemy || !enemies.includes(enemy))return;
    enemy.hp-=amount;
    particle(enemy.mesh.position.clone().add(new THREE.Vector3(0,1,0)),0xff5477,7);
    enemy.mesh.scale.setScalar(.9);
    if(enemy.hp<=0){
      scene.remove(enemy.mesh);
      enemies=enemies.filter(e=>e!==enemy);
      kills++;
      if(kills%8===0)level++;
      updateHUD();
    }
  }

  function getForward(){
    camera.getWorldDirection(tempForward);
    tempForward.y=0;
    return tempForward.normalize();
  }

  function attack(){
    if(!started||dead)return;
    const now=performance.now();
    if(now-lastAttack<420)return;
    lastAttack=now;
    slashEffect(0x8acaff,1);
    weapon.rotation.x=-.7;
    setTimeout(()=>weapon.rotation.x=0,150);

    const forward=getForward();
    let target=null,best=3.8;
    for(const e of enemies){
      const diff=e.mesh.position.clone().sub(player.position);
      const distance=diff.length();
      if(distance<best && diff.normalize().dot(forward)>.45){
        best=distance;target=e;
      }
    }
    if(target)damageEnemy(target,1);
  }

  function useSkill(key){
    if(!started||dead)return;
    const now=performance.now();
    const cooldown={q:1800,e:4200,f:2600,r:12000};
    if(now-lastSkill[key]<(cooldown[key]||1000))return;
    lastSkill[key]=now;

    if(key==='q'){
      slashEffect(0x75caff,1.6);
      weapon.rotation.x=-1.5;
      setTimeout(()=>weapon.rotation.x=0,260);
      const f=getForward();
      for(const e of [...enemies]){
        const d=e.mesh.position.clone().sub(player.position);
        if(d.length()<6&&d.normalize().dot(f)>.25)damageEnemy(e,2);
      }
    }

    if(key==='e'){
      slashEffect(0x54baff,2);
      const p=player.position;
      for(const e of [...enemies]){
        if(e.mesh.position.distanceTo(p)<5)damageEnemy(e,2);
      }
      particle(p.clone(),0x5abaff,30);
    }

    if(key==='f'){
      const direction=camera.getWorldDirection(new THREE.Vector3());
      const projectile=new THREE.Mesh(
        new THREE.BoxGeometry(.12,.12,1.1),
        new THREE.MeshBasicMaterial({color:0x9bd9ff})
      );
      projectile.position.copy(camera.position).add(direction.clone().multiplyScalar(1.5));
      projectile.quaternion.copy(camera.quaternion);
      scene.add(projectile);
      projectiles.push({mesh:projectile,velocity:direction.multiplyScalar(24),life:1.8,damage:2});
    }

    if(key==='r'){
      $('hint').textContent='낙화천풍!';
      scene.background.set(0x241322);
      setTimeout(()=>scene.background.set(0x070c18),700);
      particle(player.position.clone(),0xff9acb,55);
      slashEffect(0xff9acb,3);
      for(const e of [...enemies]){
        if(e.mesh.position.distanceTo(player.position)<13)damageEnemy(e,5);
      }
      setTimeout(()=>{$('hint').textContent='WASD 이동 · 마우스 시점 · 클릭 공격 · Q E F R 스킬';},1500);
    }
  }

  function updateHUD(){
    $('hpText').textContent=Math.max(0,Math.ceil(health));
    $('health').style.width=Math.max(0,health)+'%';
    $('kills').textContent=kills;
    $('level').textContent=level;
  }

  function endGame(){
    if(dead)return;
    dead=true;started=false;
    $('gameOver').style.display='flex';
    if(document.pointerLockElement)document.exitPointerLock();
  }

  function startGame(){
    if(started)return;
    try{
      dead=false;started=true;
      health=100;kills=0;level=1;
      enemies.forEach(e=>scene.remove(e.mesh));
      enemies=[];particles.forEach(p=>scene.remove(p.mesh));particles=[];
      projectiles.forEach(p=>scene.remove(p.mesh));projectiles=[];
      player.position.set(0,1.7,8);
      yaw=0;pitch=0;
      camera.position.copy(player.position);
      camera.rotation.set(0,0,0);
      spawnTimer=0;
      updateHUD();
      $('menu').style.display='none';
      $('gameOver').style.display='none';
      $('hud').style.display='block';
      for(let i=0;i<5;i++)spawnEnemy();
      if(innerWidth>700 && renderer.domElement.requestPointerLock){
        renderer.domElement.requestPointerLock();
      }
      clock.getDelta();
    }catch(err){
      started=false;
      showError(err.message);
    }
  }

  $('start').addEventListener('click',startGame);
  $('start').addEventListener('pointerup',e=>e.preventDefault());
  $('again').addEventListener('click',startGame);

  document.addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='Space')e.preventDefault();
    if(e.code==='KeyQ')useSkill('q');
    if(e.code==='KeyE')useSkill('e');
    if(e.code==='KeyF')useSkill('f');
    if(e.code==='KeyR')useSkill('r');
  });
  document.addEventListener('keyup',e=>keys[e.code]=false);

  renderer.domElement.addEventListener('click',()=>{
    if(started && innerWidth>700 && document.pointerLockElement!==renderer.domElement){
      renderer.domElement.requestPointerLock?.();
    }
    attack();
  });

  document.addEventListener('mousemove',e=>{
    if(!started||document.pointerLockElement!==renderer.domElement)return;
    yaw-=e.movementX*.0022;
    pitch-=e.movementY*.0022;
    pitch=Math.max(-1.35,Math.min(1.35,pitch));
    camera.rotation.set(pitch,yaw,0);
  });

  document.querySelectorAll('[data-skill]').forEach(button=>{
    button.addEventListener('pointerdown',e=>{
      e.preventDefault();
      useSkill(button.dataset.skill);
    });
  });

  // 모바일 이동 조이스틱
  const pad=$('mobilePad'),stick=$('stick');
  let padId=null,padRect=null;
  pad.addEventListener('pointerdown',e=>{
    padId=e.pointerId;padRect=pad.getBoundingClientRect();
    pad.setPointerCapture(e.pointerId);
    moveStick(e);
  });
  function moveStick(e){
    if(padId!==e.pointerId)return;
    const cx=padRect.left+padRect.width/2;
    const cy=padRect.top+padRect.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy;
    const len=Math.hypot(dx,dy),max=35;
    if(len>max){dx=dx/len*max;dy=dy/len*max;}
    stick.style.left=(35+dx)+'px';
    stick.style.top=(35+dy)+'px';
    mobile.x=dx/max;
    mobile.y=dy/max;
  }
  pad.addEventListener('pointermove',moveStick);
  function releasePad(e){
    if(padId!==e.pointerId)return;
    padId=null;mobile.x=0;mobile.y=0;
    stick.style.left='35px';stick.style.top='35px';
  }
  pad.addEventListener('pointerup',releasePad);
  pad.addEventListener('pointercancel',releasePad);

  // 모바일 오른쪽 화면 드래그 시점
  const look=$('lookArea');
  let lookId=null,lastX=0,lastY=0;
  look.addEventListener('pointerdown',e=>{
    if(!started)return;
    lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;
    look.setPointerCapture(e.pointerId);
  });
  look.addEventListener('pointermove',e=>{
    if(lookId!==e.pointerId)return;
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    lastX=e.clientX;lastY=e.clientY;
    yaw-=dx*.006;
    pitch-=dy*.006;
    pitch=Math.max(-1.35,Math.min(1.35,pitch));
    camera.rotation.set(pitch,yaw,0);
  });
  function releaseLook(e){if(lookId===e.pointerId)lookId=null;}
  look.addEventListener('pointerup',releaseLook);
  look.addEventListener('pointercancel',releaseLook);

  function update(dt){
    if(!started||dead)return;

    // 플레이어 이동
    const forward=getForward();
    tempRight.set(-forward.z,0,forward.x);
    let mx=0,mz=0;
    if(keys.KeyW||keys.ArrowUp)mz+=1;
    if(keys.KeyS||keys.ArrowDown)mz-=1;
    if(keys.KeyA||keys.ArrowLeft)mx-=1;
    if(keys.KeyD||keys.ArrowRight)mx+=1;
    mx+=mobile.x;
    mz-=mobile.y;

    const move=new THREE.Vector3();
    move.addScaledVector(forward,mz);
    move.addScaledVector(tempRight,mx);
    if(move.lengthSq()>1)move.normalize();
    player.position.addScaledVector(move,player.speed*dt);
    player.position.x=THREE.MathUtils.clamp(player.position.x,-29,29);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-29,29);
    camera.position.copy(player.position);

    // 적 추적
    for(const e of enemies){
      const diff=player.position.clone().sub(e.mesh.position);
      diff.y=0;
      const distance=diff.length();
      if(distance>1.45){
        diff.normalize();
        e.mesh.position.addScaledVector(diff,e.speed*dt);
        e.mesh.rotation.y=Math.atan2(diff.x,diff.z);
      }else{
        e.attack-=dt;
        if(e.attack<=0){
          e.attack=.9;
          health-=7;
          damageFlash=.12;
          updateHUD();
          if(health<=0){health=0;updateHUD();endGame();return;}
        }
      }
    }

    // 적 자동 생성
    spawnTimer+=dt;
    if(spawnTimer>1.7){
      spawnTimer=0;
      spawnEnemy();
    }

    // 투사체
    for(let i=projectiles.length-1;i>=0;i--){
      const p=projectiles[i];
      p.mesh.position.addScaledVector(p.velocity,dt);
      p.life-=dt;
      let hit=false;
      for(const e of [...enemies]){
        if(p.mesh.position.distanceTo(e.mesh.position.clone().add(new THREE.Vector3(0,1,0)))<1){
          damageEnemy(e,p.damage);hit=true;break;
        }
      }
      if(hit||p.life<=0){
        scene.remove(p.mesh);projectiles.splice(i,1);
      }
    }

    // 이펙트
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
