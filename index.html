<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VEXION</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08090d;
    color: white;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
}

#logo {
    position: absolute;
    top: 20px;
    left: 25px;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #fff;
    text-shadow: 0 0 20px #3978f6;
}

#stats {
    position: absolute;
    top: 20px;
    right: 25px;
    text-align: right;
    font-size: 14px;
    line-height: 1.8;
    color: #dce5ff;
}

#healthBox {
    position: absolute;
    bottom: 25px;
    left: 25px;
    width: 230px;
}

#healthText {
    font-size: 13px;
    margin-bottom: 7px;
}

#healthOuter {
    width: 100%;
    height: 12px;
    background: #242735;
    border-radius: 20px;
    overflow: hidden;
}

#health {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg,#e33b53,#ff7a7a);
    transition: width .2s;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    width: 14px;
    height: 14px;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: white;
    opacity: .85;
}

#crosshair::before {
    width: 2px;
    height: 14px;
    left: 6px;
}

#crosshair::after {
    height: 2px;
    width: 14px;
    top: 6px;
}

#toast {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 15px #3978f6;
    opacity: 0;
    transition: opacity .3s;
    white-space: nowrap;
}

#skills {
    position: absolute;
    bottom: 24px;
    right: 25px;
    display: flex;
    gap: 9px;
    pointer-events: auto;
}

.skill {
    width: 65px;
    height: 65px;
    border-radius: 13px;
    background: rgba(17,22,37,.88);
    border: 1px solid #405783;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
    user-select: none;
}

.skill strong {
    font-size: 20px;
}

.skill small {
    font-size: 10px;
    margin-top: 4px;
    color: #aabce2;
}

.skill.disabled {
    opacity: .4;
}

#startScreen,
#gameOver {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: radial-gradient(circle at center,#17213a 0%,#08090d 65%);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
}

#startScreen h1,
#gameOver h1 {
    font-size: clamp(45px,10vw,90px);
    letter-spacing: 12px;
    margin: 0;
    text-shadow: 0 0 35px #3978f6;
}

.subtitle {
    color: #9eafd4;
    letter-spacing: 5px;
    margin-top: 12px;
    margin-bottom: 40px;
}

.mainButton {
    padding: 16px 55px;
    background: linear-gradient(110deg,#2455b9,#4389ff);
    border: 0;
    border-radius: 8px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 30px #2455b966;
}

#instructions {
    margin-top: 25px;
    color: #8995b1;
    font-size: 12px;
    line-height: 2;
}

#mobileControls {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 8;
    pointer-events: none;
}

#joystickArea {
    position: absolute;
    bottom: 35px;
    left: 25px;
    width: 135px;
    height: 135px;
    border-radius: 50%;
    background: rgba(120,140,190,.12);
    border: 2px solid rgba(180,200,255,.25);
    pointer-events: auto;
    touch-action: none;
}

#joystickKnob {
    position: absolute;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: rgba(95,145,255,.55);
    border: 2px solid rgba(190,215,255,.7);
    left: 38px;
    top: 38px;
}

#mobileSkills {
    position: absolute;
    bottom: 25px;
    right: 15px;
    display: grid;
    grid-template-columns: repeat(2,62px);
    gap: 9px;
    pointer-events: auto;
}

.mobileSkill {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 1px solid #6285ca;
    color: white;
    background: rgba(20,35,65,.88);
    font-weight: bold;
    font-size: 17px;
    box-shadow: 0 0 15px #2455b944;
    touch-action: none;
}

.mobileSkill span {
    display: block;
    font-size: 9px;
    color: #a9c3ff;
    margin-top: 3px;
}

#jumpButton {
    position: absolute;
    bottom: 175px;
    right: 32px;
    width: 57px;
    height: 57px;
    border-radius: 50%;
    border: 1px solid #7897d6;
    background: rgba(30,50,90,.8);
    color: white;
    font-weight: bold;
    pointer-events: auto;
}

#mobileHint {
    position: absolute;
    bottom: 185px;
    left: 25px;
    font-size: 10px;
    color: #aabce2;
}

@media (pointer: coarse), (max-width: 800px) {
    #mobileControls {
        display: block;
    }

    #skills {
        display: none;
    }

    #healthBox {
        bottom: 15px;
        left: 15px;
        width: 145px;
    }

    #stats {
        top: 12px;
        right: 12px;
        font-size: 11px;
    }

    #logo {
        top: 12px;
        left: 14px;
        font-size: 18px;
    }

    #crosshair {
        opacity: .65;
    }

    #mobileHint {
        display: none;
    }
}

@media (max-height: 500px) {
    #joystickArea {
        width: 105px;
        height: 105px;
        bottom: 12px;
    }

    #joystickKnob {
        width: 45px;
        height: 45px;
        left: 28px;
        top: 28px;
    }

    #mobileSkills {
        bottom: 10px;
        grid-template-columns: repeat(2,52px);
    }

    .mobileSkill {
        width: 52px;
        height: 52px;
    }

    #jumpButton {
        bottom: 125px;
    }
}
</style>
</head>

<body>

<div id="startScreen">
    <h1>VEXION</h1>
    <div class="subtitle">ABILITY WAR</div>
    <button class="mainButton" id="startButton">전투 시작</button>
    <div id="instructions">
        PC : WASD 이동 / 마우스 시점 / Q E F R 스킬<br>
        모바일 : 왼쪽 이동 / 오른쪽 화면 드래그 / 스킬 버튼
    </div>
</div>

<div id="gameOver" style="display:none">
    <h1>DEFEAT</h1>
    <div class="subtitle">전투 종료</div>
    <button class="mainButton" onclick="location.reload()">다시 시작</button>
</div>

<div id="hud">
    <div id="logo">VEXION</div>

    <div id="stats">
        <div>LEVEL <span id="level">1</span></div>
        <div>KILLS <span id="kills">0</span></div>
        <div>ENEMIES <span id="enemyCount">0</span></div>
    </div>

    <div id="crosshair"></div>
    <div id="toast"></div>

    <div id="healthBox">
        <div id="healthText">HP <span id="hpText">100</span> / 100</div>
        <div id="healthOuter">
            <div id="health"></div>
        </div>
    </div>

    <div id="skills">
        <button class="skill" onclick="useSkill('Q')">
            <strong>Q</strong><small>발도술</small>
        </button>
        <button class="skill" onclick="useSkill('E')">
            <strong>E</strong><small>회전참</small>
        </button>
        <button class="skill" onclick="useSkill('F')">
            <strong>F</strong><small>비검</small>
        </button>
        <button class="skill" onclick="useSkill('R')">
            <strong>R</strong><small>궁극기</small>
        </button>
    </div>
</div>

<div id="mobileControls">
    <div id="joystickArea">
        <div id="joystickKnob"></div>
    </div>

    <div id="mobileHint">화면 오른쪽을 드래그해 시점을 조작</div>

    <button id="jumpButton">점프</button>

    <div id="mobileSkills">
        <button class="mobileSkill" onclick="useSkill('Q')">Q<span>발도술</span></button>
        <button class="mobileSkill" onclick="useSkill('E')">E<span>회전참</span></button>
        <button class="mobileSkill" onclick="useSkill('F')">F<span>비검</span></button>
        <button class="mobileSkill" onclick="useSkill('R')">R<span>궁극기</span></button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>

<script>
/* =========================================
   VEXION - MAIN GAME
========================================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080a12);
scene.fog = new THREE.Fog(0x080a12, 25, 95);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    150
);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

/* 조명 */

scene.add(new THREE.HemisphereLight(0x9bbcff,0x17101b,2));

const mainLight = new THREE.DirectionalLight(0xffffff,1.8);
mainLight.position.set(-10,20,10);
scene.add(mainLight);

const blueLight = new THREE.PointLight(0x246bff,20,45);
blueLight.position.set(0,7,0);
scene.add(blueLight);

/* 바닥 */

const floor = new THREE.Mesh(
    new THREE.CircleGeometry(45,80),
    new THREE.MeshStandardMaterial({
        color:0x151a27,
        roughness:.85
    })
);

floor.rotation.x = -Math.PI/2;
floor.position.y = -0.1;
scene.add(floor);

/* 바닥 장식 */

const grid = new THREE.GridHelper(90,45,0x263c67,0x1b253d);
grid.position.y = 0;
scene.add(grid);

/* 경기장 벽 */

const wallMaterial = new THREE.MeshStandardMaterial({
    color:0x20283b,
    roughness:.7
});

const wall = new THREE.Mesh(
    new THREE.CylinderGeometry(46,46,8,64,1,true),
    wallMaterial
);

wall.position.y = 4;
scene.add(wall);

/* 기둥 */

for(let i=0;i<12;i++){
    const a = i/12*Math.PI*2;
    const x = Math.cos(a)*30;
    const z = Math.sin(a)*30;

    const pillar = new THREE.Mesh(
        new THREE.CylinderGeometry(1.1,1.5,9,8),
        new THREE.MeshStandardMaterial({color:0x30394e})
    );

    pillar.position.set(x,4.5,z);
    scene.add(pillar);

    const glow = new THREE.PointLight(0x3978ff,3,8);
    glow.position.set(x,7,z);
    scene.add(glow);
}

/* 플레이어 */

const player = {
    x:0,
    z:0,
    hp:100,
    maxHp:100,
    speed:9,
    jump:0,
    jumpVelocity:0,
    alive:true,
    level:1,
    kills:0,
    xp:0
};

let yaw = 0;
let pitch = 0;
let started = false;
let lastTime = 0;
let gameTime = 0;

const keys = {};
const cooldowns = {
    Q:0,
    E:0,
    F:0,
    R:0
};

const cooldownMax = {
    Q:3,
    E:6,
    F:4,
    R:25
};

/* 카메라 무기 */

const weapon = new THREE.Group();
camera.add(weapon);
scene.add(camera);

const handle = new THREE.Mesh(
    new THREE.CylinderGeometry(.045,.055,.65,8),
    new THREE.MeshStandardMaterial({color:0x171923,metalness:.8})
);

handle.rotation.x = Math.PI/2;
handle.position.set(.38,-.35,-.65);
weapon.add(handle);

const blade = new THREE.Mesh(
    new THREE.BoxGeometry(.055,.055,1.05),
    new THREE.MeshStandardMaterial({
        color:0xdceaff,
        metalness:.9,
        roughness:.2
    })
);

blade.position.set(.38,-.3,-1.35);
weapon.add(blade);

const guard = new THREE.Mesh(
    new THREE.BoxGeometry(.25,.045,.08),
    new THREE.MeshStandardMaterial({color:0xb2b9c9,metalness:.8})
);

guard.position.set(.38,-.35,-.85);
weapon.add(guard);

weapon.rotation.set(-.1,0,-.12);

/* 적 */

let enemies = [];
let projectiles = [];
let particles = [];
let supplies = [];

const enemyGeometry = new THREE.CapsuleGeometry(.55,1.1,4,8);

function spawnEnemy(){
    if(!started || !player.alive) return;
    if(enemies.length >= 18) return;

    const angle = Math.random()*Math.PI*2;
    const distance = 18+Math.random()*15;

    const material = new THREE.MeshStandardMaterial({
        color:0x9d253d,
        emissive:0x390711,
        roughness:.6
    });

    const mesh = new THREE.Mesh(enemyGeometry,material);

    mesh.position.set(
        player.x+Math.cos(angle)*distance,
        1,
        player.z+Math.sin(angle)*distance
    );

    scene.add(mesh);

    const enemy = {
        mesh,
        hp:70,
        maxHp:70,
        speed:2.2+Math.random()*1.2,
        attackTimer:0,
        alive:true
    };

    enemies.push(enemy);
}

let spawnTimer = 0;

/* 이펙트 */

function createEffect(position,color,size=1,life=.4){
    const mesh = new THREE.Mesh(
        new THREE.IcosahedronGeometry(size,1),
        new THREE.MeshBasicMaterial({
            color,
            transparent:true,
            opacity:1
        })
    );

    mesh.position.copy(position);
    scene.add(mesh);

    particles.push({
        mesh,
        life,
        maxLife:life,
        velocity:new THREE.Vector3(
            (Math.random()-.5)*5,
            Math.random()*4,
            (Math.random()-.5)*5
        )
    });
}

function createSlash(color=0x9bcaff){
    const group = new THREE.Group();

    const arc = new THREE.Mesh(
        new THREE.TorusGeometry(1.8,.045,6,40,.95),
        new THREE.MeshBasicMaterial({
            color,
            transparent:true,
            opacity:.95
        })
    );

    group.add(arc);
    group.position.set(player.x,1.6,player.z);
    group.rotation.y = yaw;

    scene.add(group);

    particles.push({
        mesh:group,
        life:.28,
        maxLife:.28,
        velocity:new THREE.Vector3(0,0,0),
        special:"slash"
    });
}

function createPetals(){
    for(let i=0;i<45;i++){
        const petal = new THREE.Mesh(
            new THREE.PlaneGeometry(.18,.32),
            new THREE.MeshBasicMaterial({
                color:i%2?0xffa9c7:0xffd8e8,
                side:THREE.DoubleSide,
                transparent:true,
                opacity:.9
            })
        );

        petal.position.set(
            player.x+(Math.random()-.5)*25,
            2+Math.random()*13,
            player.z+(Math.random()-.5)*25
        );

        scene.add(petal);

        particles.push({
            mesh:petal,
            life:2+Math.random()*2,
            maxLife:4,
            velocity:new THREE.Vector3(
                (Math.random()-.5)*2,
                -1-Math.random()*2,
                (Math.random()-.5)*2
            ),
            special:"petal"
        });
    }
}

/* 피해 처리 */

function damageEnemy(enemy,damage){
    if(!enemy.alive) return;

    enemy.hp -= damage;

    createEffect(
        enemy.mesh.position.clone().add(new THREE.Vector3(0,.5,0)),
        0xff4968,
        .25,
        .25
    );

    if(enemy.hp <= 0){
        enemy.alive = false;
        scene.remove(enemy.mesh);

        enemies = enemies.filter(e=>e!==enemy);

        player.kills++;
        player.xp += 25;

        document.getElementById("kills").textContent=player.kills;

        if(player.xp >= player.level*100){
            player.xp=0;
            player.level++;
            player.maxHp+=10;
            player.hp=Math.min(player.maxHp,player.hp+20);
            showToast("LEVEL UP!");
        }
    }
}

function damageNearby(range,damage){
    for(const enemy of [...enemies]){
        const distance = enemy.mesh.position.distanceTo(
            new THREE.Vector3(player.x,1,player.z)
        );

        if(distance <= range){
            damageEnemy(enemy,damage);
        }
    }
}

/* 스킬 */

function useSkill(key){
    if(!started || !player.alive) return;
    if(cooldowns[key]>0) return;

    cooldowns[key]=cooldownMax[key];

    if(key==="Q"){
        showToast("발도술!");

        weapon.rotation.z=-.8;
        createSlash(0xffd0d8);
        damageNearby(7,45);

        setTimeout(()=>{
            weapon.rotation.z=-.12;
        },180);
    }

    if(key==="E"){
        showToast("회전참!");

        createSlash(0x8bbcff);
        damageNearby(8,55);

        setTimeout(()=>{
            createSlash(0xc9e5ff);
            damageNearby(8,30);
        },180);
    }

    if(key==="F"){
        showToast("비검!");

        const direction = new THREE.Vector3(
            -Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );

        const projectile = new THREE.Mesh(
            new THREE.BoxGeometry(.18,.12,1.4),
            new THREE.MeshBasicMaterial({
                color:0xaad7ff
            })
        );

        projectile.position.set(player.x,1.6,player.z);
        projectile.rotation.y=yaw;

        scene.add(projectile);

        projectiles.push({
            mesh:projectile,
            direction,
            speed:27,
            life:2.2,
            damage:65
        });
    }

    if(key==="R"){
        showToast("낙화천풍!");

        createPetals();

        const flash = document.createElement("div");
        flash.style.position="fixed";
        flash.style.inset="0";
        flash.style.background="rgba(255,190,215,.3)";
        flash.style.pointerEvents="none";
        flash.style.zIndex="10";
        document.body.appendChild(flash);

        setTimeout(()=>flash.remove(),180);

        damageNearby(22,180);

        createSlash(0xffb5d2);
        setTimeout(()=>createSlash(0xffe2ec),150);
        setTimeout(()=>createSlash(0xffb5d2),300);
    }
}

/* 토스트 */

let toastTimer;

function showToast(text){
    const el=document.getElementById("toast");
    el.textContent=text;
    el.style.opacity=1;

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        el.style.opacity=0;
    },1200);
}

/* 키보드 */

addEventListener("keydown",e=>{
    keys[e.code]=true;

    if(e.code==="KeyQ")useSkill("Q");
    if(e.code==="KeyE")useSkill("E");
    if(e.code==="KeyF")useSkill("F");
    if(e.code==="KeyR")useSkill("R");
    if(e.code==="Space")jump();
});

addEventListener("keyup",e=>{
    keys[e.code]=false;
});

/* 마우스 */

renderer.domElement.addEventListener("click",()=>{
    if(started && matchMedia("(pointer:fine)").matches){
        renderer.domElement.requestPointerLock?.();
    }
});

addEventListener("mousemove",e=>{
    if(document.pointerLockElement!==renderer.domElement)return;
    if(!started)return;

    yaw-=e.movementX*.0022;
    pitch-=e.movementY*.002;

    pitch=Math.max(-1.35,Math.min(1.35,pitch));
});

/* 모바일 조이스틱 */

const joystickArea=document.getElementById("joystickArea");
const joystickKnob=document.getElementById("joystickKnob");

let joystickActive=false;
let joystickX=0;
let joystickY=0;
let joystickPointer=null;

joystickArea.addEventListener("pointerdown",e=>{
    joystickActive=true;
    joystickPointer=e.pointerId;
    joystickArea.setPointerCapture(e.pointerId);
    moveJoystick(e);
});

joystickArea.addEventListener("pointermove",e=>{
    if(!joystickActive || e.pointerId!==joystickPointer)return;
    moveJoystick(e);
});

function moveJoystick(e){
    const rect=joystickArea.getBoundingClientRect();

    let dx=e.clientX-(rect.left+rect.width/2);
    let dy=e.clientY-(rect.top+rect.height/2);

    const max=42;
    const length=Math.sqrt(dx*dx+dy*dy);

    if(length>max){
        dx=dx/length*max;
        dy=dy/length*max;
    }

    joystickX=dx/max;
    joystickY=dy/max;

    joystickKnob.style.transform=`translate(${dx}px,${dy}px)`;
}

function resetJoystick(){
    joystickActive=false;
    joystickPointer=null;
    joystickX=0;
    joystickY=0;
    joystickKnob.style.transform="translate(0,0)";
}

joystickArea.addEventListener("pointerup",resetJoystick);
joystickArea.addEventListener("pointercancel",resetJoystick);

/* 모바일 시점 조작 */

let lookPointer=null;
let lastLookX=0;
let lastLookY=0;

addEventListener("pointerdown",e=>{
    if(!started)return;
    if(!matchMedia("(pointer: coarse)").matches)return;

    if(
        e.target.closest("#mobileSkills") ||
        e.target.closest("#joystickArea") ||
        e.target.closest("#jumpButton")
    )return;

    if(e.clientX<innerWidth*.35)return;

    lookPointer=e.pointerId;
    lastLookX=e.clientX;
    lastLookY=e.clientY;
});

addEventListener("pointermove",e=>{
    if(lookPointer!==e.pointerId)return;

    const dx=e.clientX-lastLookX;
    const dy=e.clientY-lastLookY;

    lastLookX=e.clientX;
    lastLookY=e.clientY;

    yaw-
