<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ZENTIX | ABILITY WAR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
button{cursor:pointer;color:white;font-weight:bold;border:1px solid #397fff;background:#101c31;border-radius:9px;padding:12px}
button:active{transform:scale(.96)}
#game{position:fixed;inset:0}
#screen{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#142747,#070b14 65%,#03050a);flex-direction:column}
.logo{font-size:clamp(48px,12vw,100px);font-weight:1000;letter-spacing:12px;text-shadow:0 0 30px #287cff}
.sub{letter-spacing:8px;color:#82b5ff;font-size:13px;margin-top:4px}
#start{margin-top:35px;padding:17px 55px;font-size:19px;background:linear-gradient(120deg,#267bff,#123b91)}
#screenText{margin-top:15px;color:#8ba4c8;font-size:12px}
#hud{display:none;position:fixed;inset:0;z-index:3;pointer-events:none}
#top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start}
.box{padding:10px 13px;border:1px solid #3b5c8a88;background:#080e1ddd;border-radius:10px;backdrop-filter:blur(8px);font-size:13px}
#hpbar{height:8px;width:180px;background:#30394a;border-radius:10px;margin-top:6px;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#11c985,#85ffbd)}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#c6e5ff;text-shadow:0 0 10px #59aaff}
#skills{position:absolute;bottom:20px;right:20px;display:flex;gap:8px;pointer-events:auto}
.skill{width:62px;height:62px;background:#0b172cdd;border:1px solid #468bff;font-size:19px}
.skill small{display:block;font-size:9px;color:#9fc4ff;margin-top:4px}
#hint{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);font-size:11px;color:#b7c9e6;white-space:nowrap}
#message{position:absolute;top:23%;left:50%;transform:translateX(-50%);font-size:25px;font-weight:bold;text-shadow:0 0 18px #3995ff;opacity:0;transition:opacity .2s;text-align:center}
#supplyMark{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:#ffdb85;text-shadow:0 0 12px #ffb52e}
#mobilePad{display:none;position:absolute;left:20px;bottom:25px;width:120px;height:120px;border-radius:50%;border:1px solid #77aaff77;background:#15315a66;pointer-events:auto}
#stick{position:absolute;left:36px;top:36px;width:46px;height:46px;border-radius:50%;background:#79adffbb}
#lookArea{display:none;position:absolute;right:0;top:15%;width:53%;height:65%;pointer-events:auto}
#overlay{display:none;position:fixed;z-index:10;inset:0;background:#030711eF;align-items:center;justify-content:center;padding:15px}
#cardPanel{width:min(850px,100%);max-height:90%;overflow:auto;background:linear-gradient(145deg,#101b30,#080d18);border:1px solid #4675b9;border-radius:16px;padding:22px;box-shadow:0 0 50px #1766c555}
#cardTitle{text-align:center;font-size:27px;margin:5px 0 8px}
#cardDesc{text-align:center;color:#9db5d8;font-size:13px;margin-bottom:20px}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{min-height:175px;text-align:left;background:#111d31;border:1px solid #45658c;padding:15px;border-radius:12px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-4px);border-color:#7cb5ff}
.card h3{font-size:17px;margin:12px 0 8px}
.card p{font-size:12px;line-height:1.6;color:#c3d1e8}
.rarity{font-size:11px;font-weight:bold;letter-spacing:2px}
.common{color:#c4d0e0}.rare{color:#48b5ff}.epic{color:#ba83ff}.legend{color:#ffc45c}.awaken{color:#ff668c}
#skip{display:block;margin:18px auto 0;background:#26344c;border-color:#61799c}
#gameover{display:none;position:fixed;z-index:12;inset:0;background:#030711ee;align-items:center;justify-content:center;flex-direction:column}
#gameover h1{font-size:48px;color:#ff5672}
#restart{padding:14px 40px;background:#236fff}
#err{display:none;position:fixed;z-index:30;bottom:8px;left:8px;right:8px;padding:12px;background:#631b2a;border:1px solid #ff6677;border-radius:8px;white-space:pre-wrap;font-size:12px}
@media(max-width:700px){
 #top{top:7px;left:7px;right:7px}
 .box{padding:7px;font-size:11px}
 #hpbar{width:120px}
 #skills{right:8px;bottom:15px;gap:4px}
 .skill{width:49px;height:53px;font-size:16px;padding:4px}
 #mobilePad{display:block}
 #lookArea{display:block}
 #hint{bottom:145px;font-size:9px}
 #cards{grid-template-columns:1fr}
 .card{min-height:115px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="screen">
  <div class="logo">ZENTIX</div>
  <div class="sub">ABILITY WAR</div>
  <button id="start">전투 시작</button>
  <div id="screenText">CHOOSE YOUR DESTINY</div>
</div>

<div id="hud">
  <div id="top">
    <div class="box">
      <div>LEVEL <b id="level">1</b>　KILLS <b id="kills">0</b></div>
      <div>HP <b id="hptext">100</b> / 100</div>
      <div id="hpbar"><div id="hpfill"></div></div>
      <div style="margin-top:5px;color:#8ebaff">무기 강화 <b id="weaponLevel">1</b></div>
    </div>
    <div class="box">ZENTIX <span style="color:#6daaff">● ONLINE</span><br><span id="enemyCount">적 0명</span></div>
  </div>
  <div id="cross">+</div>
  <div id="message"></div>
  <div id="supplyMark"></div>
  <div id="hint">WASD 이동 · 마우스 시점 · 클릭 공격 · Q E F R 스킬</div>
  <div id="skills">
    <button class="skill" data-skill="q">Q<small>발도술</small></button>
    <button class="skill" data-skill="e">E<small>회전참</small></button>
    <button class="skill" data-skill="f">F<small>비검</small></button>
    <button class="skill" data-skill="r">R<small id="ultName">낙화천풍</small></button>
  </div>
  <div id="mobilePad"><div id="stick"></div></div>
  <div id="lookArea"></div>
</div>

<div id="overlay">
  <div id="cardPanel">
    <div id="cardTitle">증강 선택</div>
    <div id="cardDesc">원하는 증강을 선택하세요.</div>
    <div id="cards"></div>
    <button id="skip">선택하지 않고 계속</button>
  </div>
</div>

<div id="gameover">
  <h1>GAME OVER</h1>
  <p id="resultText"></p>
  <button id="restart">다시 시작</button>
</div>
<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const errorBox=$('err');
function showError(e){
 errorBox.style.display='block';
 errorBox.textContent='실행 오류: '+(e.stack||e.message||e);
}
window.addEventListener('error',e=>showError(e.error||e.message));

if(!window.THREE){
 showError('Three.js 로딩 실패. 인터넷 연결을 확인해 주세요.');
 return;
}

let scene,camera,renderer,clock;
let running=false,dead=false,paused=false;
let yaw=0,pitch=0;
let hp=100,maxHp=100,level=1,kills=0,weaponLevel=1,xp=0,nextXp=5;
let enemies=[],particles=[],projectiles=[],supplies=[];
let spawnClock=0,supplyClock=0;
let lastAttack=0,skillTime={q:0,e:0,f:0,r:0};
let effects={};
let upgrades={q:0,e:0,f:0,r:0};
let passive={damage:0,speed:0,heal:0,range:0,critical:0};
let ultimate='petal';
let ultimateOptions=[
 {id:'petal',name:'낙화천풍',desc:'벚꽃과 함께 거대한 검격을 한 번 휘둘러 주변을 베어낸다.'},
 {id:'blood',name:'혈월참',desc:'붉은 검기를 방출해 전방의 적을 관통한다.'},
 {id:'heaven',name:'천지혁명',desc:'강력한 충격파로 주변 적들에게 큰 피해를 준다.'}
];
let selectedUltimate=false;
const keys={};
const mobile={x:0,y:0};
const player={pos:new THREE.Vector3(0,1.7,8),speed:6};
const forward=new THREE.Vector3();
const right=new THREE.Vector3();
let weapon,weaponBlade;

const rarity={
 common:{name:'일반',color:'#c4d0e0',class:'common'},
 rare:{name:'희귀',color:'#48b5ff',class:'rare'},
 epic:{name:'영웅',color:'#ba83ff',class:'epic'},
 legend:{name:'전설',color:'#ffc45c',class:'legend'},
 awaken:{name:'각성',color:'#ff668c',class:'awaken'}
};

try{
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x070c18);
 scene.fog=new THREE.Fog(0x070c18,30,85);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
 camera.position.copy(player.pos);
 camera.rotation.order='YXZ';

 renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 $('game').appendChild(renderer.domElement);
 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0xaacbff,0x141727,1.5));
 const sun=new THREE.DirectionalLight(0xffffff,1.2);
 sun.position.set(-10,18,9);scene.add(sun);

 const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(110,110),
  new THREE.MeshStandardMaterial({color:0x101827,roughness:.9})
 );
 floor.rotation.x=-Math.PI/2;floor.position.y=-.06;scene.add(floor);
 const grid=new THREE.GridHelper(110,55,0x27518b,0x182c49);
 grid.position.y=-.04;scene.add(grid);

 const wallMat=new THREE.MeshStandardMaterial({color:0x17243b,metalness:.4,roughness:.6});
 function box(x,y,z,sx,sy,sz,mat=wallMat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
  m.position.set(x,y,z);scene.add(m);return m;
 }
 box(0,3,-38,76,6,1);box(0,3,38,76,6,1);
 box(-38,3,0,1,6,76);box(38,3,0,1,6,76);

 for(let x of [-25,-13,13,25]){
  for(let z of [-25,-7,12,26]){
   const p=new THREE.Mesh(
    new THREE.CylinderGeometry(.65,.9,5,8),
    new THREE.MeshStandardMaterial({color:0x273e62,metalness:.5})
   );
   p.position.set(x,2.5,z);scene.add(p);
   const l=new THREE.PointLight(0x287cff,1,9);
   l.position.set(x,4.5,z);scene.add(l);
  }
 }

 // 1인칭 카타나 모델
 weapon=new THREE.Group();camera.add(weapon);
 weapon.position.set(.47,-.4,-.8);
 const handle=new THREE.Mesh(
  new THREE.CylinderGeometry(.045,.05,.4,8),
  new THREE.MeshStandardMaterial({color:0x171923})
 );
 handle.position.y=-.13;weapon.add(handle);
 const guard=new THREE.Mesh(
  new THREE.TorusGeometry(.12,.025,6,16),
  new THREE.MeshStandardMaterial({color:0xb5c6df,metalness:.8})
 );
 guard.position.y=.09;weapon.add(guard);
 weaponBlade=new THREE.Mesh(
  new THREE.BoxGeometry(.055,1.02,.035),
  new THREE.MeshStandardMaterial({color:0xe2efff,metalness:.85,roughness:.2})
 );
 weaponBlade.position.y=.62;weapon.add(weaponBlade);
 const edge=new THREE.Mesh(
  new THREE.BoxGeometry(.012,.95,.008),
  new THREE.MeshBasicMaterial({color:0x72c5ff})
 );
 edge.position.set(.03,.62,-.022);weapon.add(edge);

 function makeEnemy(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(
   new THREE.CylinderGeometry(.43,.53,1.25,8),
   new THREE.MeshStandardMaterial({color:0x9d2845})
  );
  body.position.y=.85;g.add(body);
  const head=new THREE.Mesh(
   new THREE.SphereGeometry(.34,10,8),
   new THREE.MeshStandardMaterial({color:0x241a28})
  );
  head.position.y=1.7;g.add(head);
  const eyeMat=new THREE.MeshBasicMaterial({color:0xff4668});
  for(let s of [-1,1]){
   const eye=new THREE.Mesh(new THREE.SphereGeometry(.055,6,6),eyeMat);
   eye.position.set(s*.13,1.73,-.29);g.add(eye);
  }
  const glow=new THREE.PointLight(0xff174f,.6,3);
  glow.position.y=1.3;g.add(glow);
  scene.add(g);
  return {mesh:g,hp:3+Math.floor(level*.35),speed:1.7+Math.random()*.8,attack:0};
 }

 function spawnEnemy(){
  if(enemies.length>=24)return;
  const e=makeEnemy();
  const a=Math.random()*Math.PI*2;
  const r=18+Math.random()*9;
  e.mesh.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
  enemies.push(e);
 }

 function particle(pos,color=0x65baff,count=8,power=4){
  for(let i=0;i<count;i++){
   const m=new THREE.Mesh(
    new THREE.SphereGeometry(.04+Math.random()*.05,5,5),
    new THREE.MeshBasicMaterial({color})
   );
   m.position.copy(pos);scene.add(m);
   particles.push({
    mesh:m,
    velocity:new THREE.Vector3((Math.random()-.5)*power,Math.random()*power,(Math.random()-.5)*power),
    life:.4+Math.random()*.5
   });
  }
 }

 function slash(color=0x79c8ff,size=1){
  const m=new THREE.Mesh(
   new THREE.TorusGeometry(1.15*size,.045,5,24,Math.PI*1.15),
   new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95})
  );
  m.position.copy(camera.position);
  m.position.add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(2));
  m.quaternion.copy(camera.quaternion);
  scene.add(m);
  particles.push({mesh:m,velocity:new THREE.Vector3(),life:.25,arc:true});
 }

 function blossom(pos,count=15){
  for(let i=0;i<count;i++){
   const m=new THREE.Mesh(
    new THREE.SphereGeometry(.055,5,5),
    new THREE.MeshBasicMaterial({color:i%2?0xffa4d1:0xffd6e8})
   );
   m.position.copy(pos);
   m.position.x+=(Math.random()-.5)*8;
   m.position.y+=Math.random()*5;
   m.position.z+=(Math.random()-.5)*8;
   scene.add(m);
   particles.push({
    mesh:m,
    velocity:new THREE.Vector3((Math.random()-.5)*2,-.8-Math.random(),(Math.random()-.5)*2),
    life:1.5+Math.random()
   });
  }
 }

 function announce(text){
  const m=$('message');
  m.textContent=text;m.style.opacity=1;
  clearTimeout(announce.timer);
  announce.timer=setTimeout(()=>m.style.opacity=0,1400);
 }

 function updateHUD(){
  $('level').textContent=level;
  $('kills').textContent=kills;
  $('hptext').textContent=Math.ceil(hp);
  $('hpfill').style.width=Math.max(0,hp/maxHp*100)+'%';
  $('weaponLevel').textContent=weaponLevel;
  $('enemyCount').textContent='적 '+enemies.length+'명';
 }

 function damageEnemy(e,damage){
  if(!enemies.includes(e))return;
  e.hp-=damage;
  particle(e.mesh.position.clone().add(new THREE.Vector3(0,1,0)),0xff5478,7);
  if(e.hp<=0){
   scene.remove(e.mesh);
   enemies=enemies.filter(x=>x!==e);
   kills++;xp++;
   if(xp>=nextXp){
    xp-=nextXp;level++;nextXp+=3;
    openLevelUp();
   }
   updateHUD();
  }
 }

 function forwardDirection(){
  camera.getWorldDirection(forward);
  forward.y=0;
  return forward.normalize();
 }

 function melee(damage=1,range=4.1,cone=.35,color=0x83caff){
  slash(color,1);
  const f=forwardDirection();
  for(const e of [...enemies]){
   const d=e.mesh.position.clone().sub(player.pos);
   const distance=d.length();
   if(distance<=range && d.normalize().dot(f)>cone){
    damageEnemy(e,damage+weaponLevel-1+passive.damage);
   }
  }
 }

 function attack(){
  if(!running||paused||dead)return;
  const now=performance.now();
  if(now-lastAttack<430)return;
  lastAttack=now;
  weapon.rotation.x=-.85;
  setTimeout(()=>weapon.rotation.x=0,160);
  melee(1,4,.3);
 }

 function skill(key){
  if(!running||paused||dead)return;
  const now=performance.now();
  const cooldown={q:1800,e:4300,f:2800,r:14000};
  if(now-skillTime[key]<(cooldown[key]||1000))return;
  skillTime[key]=now;

  if(key==='q'){
   announce(upgrades.q>=3?'발도술 · 극의':'발도술!');
   weapon.rotation.x=-1.5;
   setTimeout(()=>weapon.rotation.x=0,260);
   melee(2+upgrades.q,6,.15,0x83d8ff);
   if(upgrades.q>=3){
    const f=forwardDirection();
    for(const e of [...enemies]){
     const d=e.mesh.position.clone().sub(player.pos);
     if(d.length()<10&&d.normalize().dot(f)>.2)damageEnemy(e,3);
    }
    particle(player.pos.clone(),0x9ce7ff,25,7);
   }
  }

  if(key==='e'){
   announce('회전참!');
   slash(0x6bbcff,1.6);
   particle(player.pos.clone(),0x8acbff,22,6);
   for(const e of [...enemies]){
    if(e.mesh.position.distanceTo(player.pos)<5+upgrades.e)damageEnemy(e,2+upgrades.e);
   }
  }

  if(key==='f'){
   announce('비검!');
   const dir=camera.getWorldDirection(new THREE.Vector3());
   const m=new THREE.Mesh(
    new THREE.BoxGeometry(.09,.09,1.2),
    new THREE.MeshBasicMaterial({color:0xa8e1ff})
   );
   m.position.copy(camera.position).add(dir.clone().multiplyScalar(1.4));
   m.quaternion.copy(camera.quaternion);scene.add(m);
   projectiles.push({mesh:m,velocity:dir.multiplyScalar(25),life:2,damage:2+upgrades.f});
  }

  if(key==='r')useUltimate();
 }

 function useUltimate(){
  if(ultimate==='petal'){
   announce('낙화천풍');
   blossom(player.pos.clone(),70);
   slash(0xffa7d4,3);
   for(const e of [...enemies]){
    if(e.mesh.position.distanceTo(player.pos)<14)damageEnemy(e,8+upgrades.r*3);
   }
   scene.background.set(0x251322);
   setTimeout(()=>scene.background.set(0x070c18),800);
  }
  if(ultimate==='blood'){
   announce('혈월참');
   slash(0xff3158,3);
   const f=forwardDirection();
   for(const e of [...enemies]){
    const d=e.mesh.position.clone().sub(player.pos);
    if(d.length()<22&&d.normalize().dot(f)>.15)damageEnemy(e,12+upgrades.r*3);
   }
   particle(player.pos.clone(),0xff365a,40,8);
  }
  if(ultimate==='heaven'){
   announce('천지혁명');
   particle(player.pos.clone(),0xb9d9ff,75,10);
   for(const e of [...enemies]){
    if(e.mesh.position.distanceTo(player.pos)<18)damageEnemy(e,14+upgrades.r*3);
   }
  }
 }

 // 증강 목록
 const augmentPool=[
  {id:'q1',name:'섬광 발도',desc:'발도술 피해량 증가.',rarity:'common',type:'skill',skill:'q'},
  {id:'q2',name:'잔상 베기',desc:'발도술 공격 범위 증가.',rarity:'rare',type:'skill',skill:'q'},
  {id:'e1',name:'회전 강화',desc:'회전참 피해량 증가.',rarity:'common',type:'skill',skill:'e'},
  {id:'e2',name:'폭풍의 칼날',desc:'회전참 범위 증가.',rarity:'rare',type:'skill',skill:'e'},
  {id:'f1',name:'비검 연마',desc:'비검 피해량 증가.',rarity:'common',type:'skill',skill:'f'},
  {id:'f2',name:'관통 검기',desc:'비검의 공격력이 강화된다.',rarity:'epic',type:'skill',skill:'f'},
  {id:'r1',name:'궁극의 여운',desc:'궁극기 피해량 증가.',rarity:'epic',type:'skill',skill:'r'},
  {id:'p1',name:'강철의 육체',desc:'최대 체력이 20 증가한다.',rarity:'common',type:'passive',effect:'hp'},
  {id:'p2',name:'날렵한 발걸음',desc:'이동 속도가 증가한다.',rarity:'rare',type:'passive',effect:'speed'},
  {id:'p3',name:'흡혈의 검',desc:'적 처치 시 체력을 회복한다.',rarity:'epic',type:'passive',effect:'heal'},
  {id:'p4',name:'예리한 칼날',desc:'모든 공격 피해량이 증가한다.',rarity:'rare',type:'passive',effect:'damage'},
  {id:'p5',name:'치명적인 일격',desc:'공격력이 추가로 증가한다.',rarity:'legend',type:'passive',effect:'critical'}
 ];

 const awakeningPool=[

 let owned=new Set();
 function applyAugment(a){
  owned.add(a.id);
  if(a.type==='skill'){
   upgrades[a.skill]++;
   if(a.id==='aq')upgrades.q=Math.max(3,upgrades.q);
  }else{
   if(a.effect==='hp'){maxHp+=20;hp=Math.min(maxHp,hp+20);}
   if(a.effect==='speed')passive.speed+=.7;
   if(a.effect==='heal')passive.heal++;
   if(a.effect==='damage')passive.damage++;
   if(a.effect==='critical')passive.critical+=2;
  }
  announce(a.name+' 획득!');
  updateHUD();
 }

 function eligible(pool){
  return pool.filter(a=>!owned.has(a.id)&&(!a.requires||upgrades[a.requires]>0));
 }

 function chooseCards(list,title,desc){
  paused=true;
  $('overlay').style.display='flex';
  $('cardTitle').textContent=title;
  $('cardDesc').textContent=desc;
  const wrap=$('cards');wrap.innerHTML='';
  list.forEach(a=>{
   const r=rarity[a.rarity];
   const el=document.createElement('div');
   el.className='card';
   el.style.borderColor=r.color;
   el.innerHTML=
    '<div class="rarity '+r.class+'">'+r.name+'</div>'+
    '<h3>'+a.name+'</h3><p>'+a.desc+'</p>';
   el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(a.id==='ult-petal'||a.id==='ult-blood'||a.id==='ult-heaven'){
     ultimate=a.id.replace('ult-','');
     $('ultName').textContent=ultimateOptions.find(x=>x.id===ultimate).name;
    }else if(a.type==='weapon'){
     weaponLevel++;
     announce('무기 강화!');
    }else applyAugment(a);
    closeOverlay();
   });
   wrap.appendChild(el);
  });
 }

 function closeOverlay(){
  $('overlay').style.display='none';
  paused=false;
  clock.getDelta();
 }

 $('skip').addEventListener('pointerdown',e=>{
  e.preventDefault();closeOverlay();
 });
