<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZENTIX - ABILITY WAR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#08090d;color:white;font-family:Arial,sans-serif}
button{border:0;color:white;cursor:pointer;font-weight:bold}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(10,13,22,.85);border:1px solid #293b60;border-radius:12px;backdrop-filter:blur(10px)}
#topbar{position:absolute;top:15px;left:15px;padding:12px 17px;min-width:210px}
#logo{font-size:22px;font-weight:900;letter-spacing:4px;color:#5c9cff}
#stats{font-size:13px;color:#c8d5ed;margin-top:8px;line-height:1.8}
#healthBox{position:absolute;top:15px;right:15px;width:210px;padding:12px}
.bar{height:10px;background:#242a37;border-radius:10px;overflow:hidden;margin-top:5px}
.fill{height:100%;width:100%;transition:width .2s}
#hpFill{background:linear-gradient(90deg,#e33d55,#ff7887)}
#xpFill{background:linear-gradient(90deg,#3277ed,#69b4ff)}
#skills{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:9px}
.skill{width:66px;height:66px;background:rgba(10,15,27,.9);border:1px solid #47638d;border-radius:12px;text-align:center;padding-top:8px}
.skill b{font-size:23px;color:#75aaff}
.skill small{display:block;font-size:10px;color:#b9c8df;margin-top:4px}
#crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:.8}
#message{position:absolute;top:25%;width:100%;text-align:center;font-size:26px;font-weight:900;text-shadow:0 2px 10px black}
#startScreen,#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#182744 0%,#08090d 70%)}
.card{width:min(92%,520px);padding:30px;text-align:center;background:rgba(9,13,24,.96);border:1px solid #31548c;border-radius:20px;box-shadow:0 0 60px #102c55}
.title{font-size:48px;font-weight:1000;letter-spacing:8px;color:#65a3ff}
.subtitle{letter-spacing:5px;color:#a8bad8;margin:8px 0 25px}
.primary{background:linear-gradient(100deg,#2365d9,#459aff);padding:15px 35px;border-radius:10px;font-size:17px;margin-top:18px}
.primary:active{transform:scale(.97)}
.description{font-size:13px;color:#aab8ce;line-height:1.8}
#overlay{display:none;background:rgba(2,4,10,.88)}
#choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.choice{width:145px;min-height:150px;padding:14px;background:#111c30;border:1px solid #45618a;border-radius:12px;text-align:left}
.choice:hover{border-color:#75aaff;background:#1a2b49}
.choice strong{display:block;color:#80b4ff;margin-bottom:10px}
.choice span{font-size:12px;line-height:1.6;color:#d2dced}
#mobile{display:none;position:fixed;inset:0;pointer-events:none;z-index:5}
#stick{position:absolute;left:20px;bottom:35px;width:115px;height:115px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff44;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:45px;height:45px;border-radius:50%;background:#70aaff99}
#mobileSkills{position:absolute;right:15px;bottom:20px;display:grid;grid-template-columns:repeat(2,58px);gap:8px;pointer-events:auto}
#mobileSkills button{height:58px;border-radius:12px;background:#172b4cdd;border:1px solid #6497dc;font-size:18px}
#look{position:absolute;right:0;top:0;width:60%;height:70%;pointer-events:auto;touch-action:none}
#damageFlash{position:fixed;inset:0;pointer-events:none;background:#ff173322;opacity:0;z-index:4}
#dead{display:none;position:fixed;inset:0;z-index:20;background:#08090df2;align-items:center;justify-content:center;text-align:center}
@media(max-width:700px){
 #topbar{top:8px;left:8px;padding:8px;min-width:130px}
 #logo{font-size:17px}
 #stats{font-size:10px}
 #healthBox{top:8px;right:8px;width:145px;padding:8px;font-size:11px}
 #skills{display:none}
 #mobile{display:block}
 #message{top:22%;font-size:20px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="topbar" class="panel">
  <div id="logo">ZENTIX</div>
  <div id="stats">
   <div>ABILITY WAR · SURVIVAL</div>
   <div>LEVEL <b id="level">1</b>　KILL <b id="kills">0</b></div>
   <div>적 생존 시간 <b id="time">0:00</b></div>
  </div>
 </div>
 <div id="healthBox" class="panel">
  <div>체력 <b id="hpText">100 / 100</b></div>
  <div class="bar"><div id="hpFill" class="fill"></div></div>
  <div style="margin-top:10px">경험치 <b id="xpText">0 / 100</b></div>
  <div class="bar"><div id="xpFill" class="fill"></div></div>
 </div>
 <div id="crosshair"></div>
 <div id="message"></div>
 <div id="skills">
  <div class="skill"><b>Q</b><small>발도술</small></div>
  <div class="skill"><b>E</b><small>회전참</small></div>
  <div class="skill"><b>F</b><small>비검</small></div>
  <div class="skill"><b>R</b><small>궁극기</small></div>
 </div>
</div>
<div id="damageFlash"></div>

<div id="startScreen">
 <div class="card">
  <div class="title">ZENTIX</div>
  <div class="subtitle">ABILITY WAR</div>
  <p class="description">
   끝없이 몰려오는 적을 처치하고<br>
   증강을 선택해 최강의 사무라이로 성장하라.
  </p>
  <p class="description">WASD 이동 · 마우스 시점 · 좌클릭 공격</p>
  <button class="primary" id="startBtn">전투 시작</button>
  <p class="description">모바일은 화면 조이스틱으로 조작할 수 있습니다.</p>
 </div>
</div>

<div id="overlay">
 <div class="card">
  <div class="title" id="overlayTitle" style="font-size:30px;letter-spacing:3px">증강 선택</div>
  <p class="description" id="overlayDesc">원하는 능력을 선택하세요.</p>
  <div id="choices"></div>
 </div>
</div>

<div id="mobile">
 <div id="stick"><div id="knob"></div></div>
 <div id="look"></div>
 <div id="mobileSkills">
  <button data-skill="Q">Q</button>
  <button data-skill="E">E</button>
  <button data-skill="F">F</button>
  <button data-skill="R">R</button>
  <button data-skill="ATTACK">⚔</button>
 </div>
</div>

<div id="dead">
 <div class="card">
  <div class="title" style="font-size:38px">DEFEATED</div>
  <p id="resultText">생존 종료</p>
  <button class="primary" id="restartBtn">다시 도전</button>
 </div>
</div>

<script>
'use strict';

const $=id=>document.getElementById(id);
let scene,camera,renderer,clock;
let running=false,paused=false,dead=false;
let player={hp:100,maxHp:100,speed:7,damage:25,level:1,xp:0,nextXp:100,kills:0};
let keys={},enemies=[],particles=[],supplies=[],projectiles=[];
let yaw=0,pitch=0,lastAttack=0,gameTime=0,spawnClock=0,supplyClock=0;
let attackPower=1,weaponLevel=1;
let passive={damage:0,speed:0,maxHp:0,heal:0,critical:0};
let augments=new Set();
let skillLevel={Q:0,E:0,F:0,R:0};
let cooldown={Q:0,E:0,F:0,R:0};
let ultimate='낙화천풍';
let sword,hand,swordPivot;
let moveInput={x:0,y:0};
let joystickActive=false,lookTouch=null;
let messageTimer=0;

function showMessage(text,duration=1500){
 $('message').textContent=text;
 messageTimer=duration;
}
function updateHUD(){
 $('level').textContent=player.level;
 $('kills').textContent=player.kills;
 $('hpText').textContent=Math.ceil(player.hp)+' / '+player.maxHp;
 $('hpFill').style.width=Math.max(0,player.hp/player.maxHp*100)+'%';
 $('xpText').textContent=player.xp+' / '+player.nextXp;
 $('xpFill').style.width=player.xp/player.nextXp*100+'%';
 let m=Math.floor(gameTime/60),s=Math.floor(gameTime%60);
 $('time').textContent=m+':'+String(s).padStart(2,'0');
}

function init3D(){
 if(!window.THREE){alert('3D 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');return false;}
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x090d18);
 scene.fog=new THREE.Fog(0x090d18,22,85);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
 camera.position.set(0,1.7,5);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.shadowMap.enabled=true;
 $('game').appendChild(renderer.domElement);
 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0x9bbcff,0x17111c,1.4));
 let light=new THREE.DirectionalLight(0xffffff,1.5);
 light.position.set(-8,15,7);
 light.castShadow=true;
 scene.add(light);

 let floor=new THREE.Mesh(
  new THREE.PlaneGeometry(180,180),
  new THREE.MeshStandardMaterial({color:0x171d2a,roughness:.9})
 );
 floor.rotation.x=-Math.PI/2;
 floor.position.y=0;
 floor.receiveShadow=true;
 scene.add(floor);

 let grid=new THREE.GridHelper(180,90,0x263b5d,0x1c2b43);
 grid.position.y=.015;
 scene.add(grid);

 createEnvironment();
 createWeapon();
 window.addEventListener('resize',resize);
 return true;
}

function createEnvironment(){
 for(let i=0;i<45;i++){
  let a=Math.random()*Math.PI*2;
  let r=20+Math.random()*55;
  let h=2+Math.random()*5;
  let trunk=new THREE.Mesh(
   new THREE.CylinderGeometry(.18,.3,h,6),
   new THREE.MeshStandardMaterial({color:0x29232d})
  );
  trunk.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);
  scene.add(trunk);
  let crown=new THREE.Mesh(
   new THREE.IcosahedronGeometry(1.5+Math.random()*1.5,1),
   new THREE.MeshStandardMaterial({color:0x252c46,flatShading:true})
  );
  crown.position.set(trunk.position.x,h+1,trunk.position.z);
  scene.add(crown);
 }
}

function createWeapon(){
 swordPivot=new THREE.Group();
 camera.add(swordPivot);
 swordPivot.position.set(.48,-.43,-.85);
 swordPivot.rotation.set(.15,-.2,-.3);

 hand=new THREE.Mesh(
  new THREE.BoxGeometry(.16,.22,.28),
  new THREE.MeshStandardMaterial({color:0xc69b7a})
 );
 hand.position.set(0,-.1,.1);
 swordPivot.add(hand);

 let grip=new THREE.Mesh(
  new THREE.CylinderGeometry(.045,.045,.42,8),
  new THREE.MeshStandardMaterial({color:0x171a22})
 );
 grip.rotation.z=Math.PI/2;
 grip.position.set(0,-.04,-.17);
 swordPivot.add(grip);

 let guard=new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.12,.035,12),
  new THREE.MeshStandardMaterial({color:0xb5a16d,metalness:.7})
 );
 guard.rotation.z=Math.PI/2;
 guard.position.set(0,-.04,-.39);
 swordPivot.add(guard);

 sword=new THREE.Mesh(
  new THREE.BoxGeometry(.055,.035,1.12),
  new THREE.MeshStandardMaterial({color:0xdce8f5,metalness:.85,roughness:.2})
 );
 sword.position.set(0,-.04,-.95);
 swordPivot.add(sword);

 let edge=new THREE.Mesh(
  new THREE.BoxGeometry(.012,.008,1.05),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 edge.position.set(.029,-.018,-.95);
 swordPivot.add(edge);
}

function resize(){
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

function startGame(){
 if(running)return;
 if(!init3D())return;
 running=true;
 paused=false;
 dead=false;
 $('startScreen').style.display='none';
 player.hp=player.maxHp=100;
 player.level=1;player.xp=0;player.nextXp=100;player.kills=0;
 player.damage=25;player.speed=7;
 gameTime=0;spawnClock=0;supplyClock=0;
 yaw=0;pitch=0;
 camera.position.set(0,1.7,5);
 updateHUD();
 showMessage('생존 모드 시작!',1800);
 showUltimateChoice();
 renderer.domElement.addEventListener('click',()=>{
  if(running&&!paused&&!dead&&document.pointerLockElement!==renderer.domElement&&innerWidth>700){
   renderer.domElement.requestPointerLock?.();
  }
 });
 animate();
}

function showUltimateChoice(){
 paused=true;
 openChoices('궁극기 선택','R 슬롯에 장착할 궁극기를 선택하세요.',[
  {name:'낙화천풍',desc:'벚꽃과 함께 거대한 일섬을 날려 넓은 범위의 적을 베어냅니다.',rarity:'전설'},
  {name:'혈월참',desc:'붉은 검격을 방출해 전방의 적에게 강력한 피해를 줍니다.',rarity:'전설'},
  {name:'천지혁명',desc:'주변의 적들을 끌어당긴 뒤 강력한 충격파를 일으킵니다.',rarity:'전설'}
 ],item=>{
  ultimate=item.name;
  paused=false;
  showMessage(ultimate+' 장착 완료!',1600);
 });
}

function openChoices(title,desc,items,onPick){
 paused=true;
 $('overlayTitle').textContent=title;
 $('overlayDesc').textContent=desc;
 let box=$('choices');
 box.innerHTML='';
 $('overlay').style.display='flex';
 items.forEach(item=>{
  let b=document.createElement('button');
  b.className='choice';
  b.innerHTML='<strong>'+item.name+'</strong><span>'+item.desc+'</span><br><br><small style="color:#e6c879">'+(item.rarity||'증강')+'</small>';
  b.onclick=()=>{
   $('overlay').style.display='none';
   onPick(item);
   paused=false;
   updateHUD();
  };
  box.appendChild(b);
 });
}

function makeEnemy(){
 let angle=Math.random()*Math.PI*2;
 let dist=19+Math.random()*10;
 let group=new THREE.Group();
 let body=new THREE.Mesh(
  new THREE.CylinderGeometry(.38,.48,1.25,8),
  new THREE.MeshStandardMaterial({color:0x8b3048,roughness:.8})
 );
 body.position.y=.85;
 body.castShadow=true;
 group.add(body);
 let head=new THREE.Mesh(
  new THREE.SphereGeometry(.32,10,8),
  new THREE.MeshStandardMaterial({color:0xc18d83})
 );
 head.position.y=1.68;
 group.add(head);
 let eyeMat=new THREE.MeshBasicMaterial({color:0xff394e});
 for(let side of [-1,1]){
  let eye=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),eyeMat);
  eye.position.set(side*.12,1.72,-.27);
  group.add(eye);
 }
 group.position.set(camera.position.x+Math.cos(angle)*dist,0,camera.position.z+Math.sin(angle)*dist);
 scene.add(group);
 enemies.push({mesh:group,hp:55+player.level*9,maxHp:55+player.level*9,speed:1.3+Math.random()*.7,hit:0});
}

function makeParticle(pos,color,size=.15,life=.5,velocity=null){
 let mesh=new THREE.Mesh(
  new THREE.SphereGeometry(size,6,6),
  new THREE.MeshBasicMaterial({color,transparent:true,opacity:1})
 );
 mesh.position.copy(pos);
 scene.add(mesh);
 particles.push({mesh,life,max:life,velocity:velocity||new THREE.Vector3((Math.random()-.5)*3,Math.random()*2,(Math.random()-.5)*3)});
}

function slashEffect(color=0x8bbdff,big=false){
 let origin=camera.position.clone();
 let dir=new THREE.Vector3();
 camera.getWorldDirection(dir);
 let center=origin.clone().add(dir.multiplyScalar(2.4));
 let arc=new THREE.Mesh(
  new THREE.TorusGeometry(big?1.6:1.1,.035,6,32,Math.PI*1.15),
  new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9})
 );
 arc.position.copy(center);
 arc.quaternion.copy(camera.quaternion);
 arc.rotateZ(-.55);
 scene.add(arc);
 particles.push({mesh:arc,life:.25,max:.25,velocity:new THREE.Vector3(0,0,0)});
}

function damageEnemy(enemy,damage){
 if(!enemy||!enemy.mesh.parent)return;
 enemy.hp-=damage;
 for(let i=0;i<5;i++)makeParticle(enemy.mesh.position.clone().add(new THREE.Vector3(0,1,0)),0xff6677,.08,.3);
 if(enemy.hp<=0){
  scene.remove(enemy.mesh);
  enemies=enemies.filter(e=>e!==enemy);
  player.kills++;
  gainXP(22);
  if(passive.heal>0)player.hp=Math.min(player.maxHp,player.hp+passive.heal*2);
  updateHUD();
 }
}

function getForward(){
 let d=new THREE.Vector3();
 camera.getWorldDirection(d);
 d.y=0;
 return d.normalize();
}

function attack(){
 if(!running||paused||dead)return;
 let now=performance.now();
 if(now-lastAttack<430)return;
 lastAttack=now;
 swordPivot.rotation.z=-.85;
 setTimeout(()=>{if(swordPivot)swordPivot.rotation.z=-.3},130);
 slashEffect(0xb7d8ff,false);
 let dir=getForward();
 let candidates=enemies.filter(e=>{
  let to=e.mesh.position.clone().sub(camera.position);
  let distance=to.length();
  to.y=0;to.normalize();
  return distance<4.2&&dir.dot(to)>.25;
 });
 candidates.forEach(e=>damageEnemy(e,player.damage+passive.damage*5));
}

function useSkill(key){
 if(!running||paused||dead)return;
 if(key==='ATTACK'){attack();return;}
 let now=performance.now()/1000;
 if((cooldown[key]||0)>now){showMessage('스킬 재사용 대기 중',500);return;}
 let level=skillLevel[key]||0;
 if(key==='Q'){
  cooldown.Q=now-Math.max(0,0);
  cooldown.Q=now+Math.max(2.5,6-level*.5);
  slashEffect(0xffd7a0,true);
  let dir=getForward();
  enemies.slice().forEach(e=>{
   let to=e.mesh.position.clone().sub(camera.position);
   let d=to.length();to.y=0;to.normalize();
   if(d<9&&dir.dot(to)>.55)damageEnemy(e,65+level*25+player.damage);
  });
  showMessage('발도술!',500);
 }else if(key==='E'){
  cooldown.E=now+Math.max(4,9-level*.6);
  slashEffect(0x8bdcff,true);
  enemies.slice().forEach(e=>{
   let d=e.mesh.position.distanceTo(camera.position);
   if(d<5.5)damageEnemy(e,40+level*18+player.damage*.7);
  });
  showMessage('회전참!',500);
 }else if(key==='F'){
  cooldown.F=now+Math.max(3,7-level*.5);
  let dir=getForward();
  let p=new THREE.Mesh(new THREE.BoxGeometry(.12,.08,1.3),new THREE.MeshBasicMaterial({color:0xddeeff}));
  p.position.copy(camera.position).add(dir.clone().multiplyScalar(1.2));
  p.position.y-=.15;
  p.quaternion.copy(camera.quaternion);
  scene.add(p);
  projectiles.push({mesh:p,dir,speed:22,life:1.4,damage:55+level*25});
  showMessage('비검!',500);
 }else if(key==='R'){
  cooldown.R=now+Math.max(12,22-level*2);
  ultimateAttack();
 }
}

function ultimateAttack(){
 showMessage(ultimate+' 발동!',1600);
 if(ultimate==='낙화천풍'){
  for(let i=0;i<45;i++){
   let p=camera.position.clone().add(new THREE.Vector3((Math.random()-.5)*12,Math.random()*5-1,-5-Math.random()*9));
   makeParticle(p,0xffa6c7,.09,1.3,new THREE.Vector3(0,-.5,0));
  }
  slashEffect(0xffb4d0,true);
  enemies.slice().forEach(e=>{
   let d=e.mesh.position.distanceTo(camera.position);
   if(d<15)damageEnemy(e,190+player.damage*2);
  });
 }else if(ultimate==='혈월참'){
  slashEffect(0xff183d,true);
  slashEffect(0xff6a76,true);
  let dir=getForward();
  enemies.slice().forEach(e=>{
   let to=e.mesh.position.clone().sub(camera.position);
   let d=to.length();to.y=0;to.normalize();
   if(d<18&&dir.dot(to)>.15)damageEnemy(e,240+player.damage*2);
  });
 }else{
  for(let i=0;i<55;i++){
   let a=i/55*Math.PI*2;
   makeParticle(camera.position.clone().add(new THREE.Vector3(Math.cos(a)*4,1,Math.sin(a)*4)),0x8b9fff,.16,.8);
  }
  enemies.slice().forEach(e=>{
   let d=e.mesh.position.distanceTo(camera.position);
   if(d<11)damageEnemy(e,210+player.damage*2);
  });
 }
}
 function gainXP(amount){
 player.xp+=amount;
 while(player.xp>=player.nextXp){
  player.xp-=player.nextXp;
  player.level++;
  player.nextXp=Math.floor(player.nextXp*1.32);
  player.hp=Math.min(player.maxHp,player.hp+15);
  levelUp();
 }
 updateHUD();
}

const augmentPool=[
 {name:'날카로운 칼날',desc:'모든 공격 피해량이 15% 증가합니다.',rarity:'일반',type:'damage'},
 {name:'질풍의 발걸음',desc:'이동 속도가 12% 증가합니다.',rarity:'일반',type:'speed'},
 {name:'생명력 강화',desc:'최대 체력이 25 증가하고 체력을 회복합니다.',rarity:'희귀',type:'hp'},
 {name:'흡혈의 검',desc:'적 처치 시 체력을 회복합니다.',rarity:'희귀',type:'heal'},
 {name:'발도술 강화',desc:'Q 발도술 피해량이 증가합니다.',rarity:'희귀',type:'Q'},
 {name:'회전참 강화',desc:'E 회전참 피해량이 증가합니다.',rarity:'희귀',type:'E'},
 {name:'비검 강화',desc:'F 비검 피해량이 증가합니다.',rarity:'영웅',type:'F'},
 {name:'궁극의 힘',desc:'궁극기 피해량이 증가합니다.',rarity:'영웅',type:'R'},
 {name:'치명적인 일격',desc:'공격력이 추가로 증가합니다.',rarity:'영웅',type:'critical'}
];

const awakeningPool=[
 {name:'발도술 · 극의',desc:'발도술의 사거리와 피해량이 크게 증가합니다.',type:'Q'},
 {name:'회전참 · 무한',desc:'회전참의 공격 범위와 피해량이 증가합니다.',type:'E'},
 {name:'비검 · 천공',desc:'비검이 더욱 강력한 검기를 발사합니다.',type:'F'},
 {name:'낙화천풍 · 만개',desc:'궁극기 낙화천풍의 피해량이 크게 증가합니다.',type:'R'}
];

function levelUp(){
 showMessage('LEVEL UP!',1200);
 let pool=augmentPool.filter(a=>!augments.has(a.name));
 if(pool.length===0)pool=augmentPool;
 let choices=[];
 while(choices.length<3&&pool.length){
  let index=Math.floor(Math.random()*pool.length);
  choices.push(pool.splice(index,1)[0]);
 }
 openChoices('LEVEL UP','증강을 선택하세요. 각성은 일반 레벨업에서 등장하지 않습니다.',choices,a=>{
  applyAugment(a,false);
 });
}

function applyAugment(a,isAwakening){
 if(augments.has(a.name))return;
 augments.add(a.name);
 if(a.type==='damage'){
  player.damage=Math.round(player.damage*1.15);
 }else if(a.type==='speed'){
  player.speed*=1.12;
 }else if(a.type==='hp'){
  player.maxHp+=25;
  player.hp=Math.min(player.maxHp,player.hp+25);
 }else if(a.type==='heal'){
  passive.heal+=1;
 }else if(a.type==='critical'){
  passive.critical++;
  player.damage+=5;
 }else if(['Q','E','F','R'].includes(a.type)){
  skillLevel[a.type]++;
 }
 showMessage((isAwakening?'각성 획득! ':'증강 획득! ')+a.name,1800);
 updateHUD();
}

function spawnSupply(){
 let angle=Math.random()*Math.PI*2;
 let distance=12+Math.random()*18;
 let group=new THREE.Group();
 let box=new THREE.Mesh(
  new THREE.BoxGeometry(.9,.7,.9),
  new THREE.MeshStandardMaterial({color:0x3478df,metalness:.5,roughness:.35})
 );
 box.position.y=.45;
 group.add(box);
 let lid=new THREE.Mesh(
  new THREE.BoxGeometry(1,.16,1),
  new THREE.MeshStandardMaterial({color:0x8cc7ff,metalness:.5})
 );
 lid.position.y=.88;
 group.add(lid);
 let glow=new THREE.PointLight(0x398aff,2,7);
 glow.position.y=1.3;
 group.add(glow);
 group.position.set(
  camera.position.x+Math.cos(angle)*distance,
  0,
  camera.position.z+Math.sin(angle)*distance
 );
 scene.add(group);
 supplies.push({mesh:group});
 showMessage('보급품이 맵에 생성되었습니다!',1700);
}

function collectSupply(supply){
 scene.remove(supply.mesh);
 supplies=supplies.filter(s=>s!==supply);
 let roll=Math.random();
 if(roll<.15){
  let available=awakeningPool.filter(a=>!augments.has(a.name));
  if(available.length){
   let a=available[Math.floor(Math.random()*available.length)];
   openChoices('★ 각성 보급품','15% 확률로 등장한 각성 증강입니다!',[{
    name:a.name,desc:a.desc,rarity:'각성',type:a.type
   }],item=>applyAugment(item,true));
   return;
  }
 }
 let reward=Math.random();
 if(reward<.5){
  weaponLevel++;
  player.damage+=8;
  showMessage('무기 강화! 공격력 증가 · 무기 Lv.'+weaponLevel,2000);
 }else{
  let pool=augmentPool.filter(a=>!augments.has(a.name));
  if(pool.length){
   let a=pool[Math.floor(Math.random()*pool.length)];
   openChoices('보급품 획득','보급품에서 특별 증강을 발견했습니다.',[a],item=>applyAugment(item,false));
  }else{
   player.maxHp+=10;
   player.hp=Math.min(player.maxHp,player.hp+30);
   showMessage('보급품 획득! 체력과 최대 체력 증가',1800);
  }
 }
 updateHUD();
}

function updateMovement(dt){
 let forward=getForward();
 let right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();
 let x=0,z=0;
 if(keys.KeyW)z+=1;
 if(keys.KeyS)z-=1;
 if(keys.KeyA)x-=1;
 if(keys.KeyD)x+=1;
 x+=moveInput.x;
 z+=moveInput.y;
 let move=new THREE.Vector3();
 move.addScaledVector(right,x);
 move.addScaledVector(forward,z);
 if(move.length()>1)move.normalize();
 camera.position.addScaledVector(move,player.speed*dt);
 camera.position.y=1.7;
}

function updateEnemies(dt){
 enemies.slice().forEach(e=>{
  let target=camera.position.clone();
  target.y=0;
  let pos=e.mesh.position;
  let dir=target.sub(pos);
  let distance=dir.length();
  if(distance>0.01){
   dir.normalize();
   pos.addScaledVector(dir,e.speed*dt);
   e.mesh.rotation.y=Math.atan2(dir.x,dir.z);
  }
  if(distance<1.55){
   e.hit-=dt;
   if(e.hit<=0){
    e.hit=.85;
    let reduction=Math.max(0,passive.heal);
    player.hp-=Math.max(2,7-reduction);
    $('damageFlash').style.opacity='.8';
    setTimeout(()=>$('damageFlash').style.opacity='0',100);
    if(player.hp<=0)gameOver();
    updateHUD();
   }
  }
 });
}

function updateProjectiles(dt){
 projectiles.slice().forEach(p=>{
  p.mesh.position.addScaledVector(p.dir,p.speed*dt);
  p.life-=dt;
  let hit=enemies.find(e=>e.mesh.position.distanceTo(p.mesh.position)<1);
  if(hit){
   damageEnemy(hit,p.damage);
   for(let i=0;i<9;i++)makeParticle(p.mesh.position.clone(),0xa6d8ff,.1,.4);
   p.life=0;
  }
  if(p.life<=0){
   scene.remove(p.mesh);
   projectiles=projectiles.filter(x=>x!==p);
  }
 });
}

function updateParticles(dt){
 particles.slice().forEach(p=>{
  p.life-=dt;
  p.mesh.position.addScaledVector(p.velocity,dt);
  p.mesh.material.opacity=Math.max(0,p.life/p.max);
  p.mesh.scale.multiplyScalar(.99);
  if(p.life<=0){
   scene.remove(p.mesh);
   particles=particles.filter(x=>x!==p);
  }
 });
}

function updateSupplies(){
 supplies.slice().forEach(s=>{
  let distance=s.mesh.position.distanceTo(camera.position);
  s.mesh.rotation.y+=.01;
  if(distance<2.5)collectSupply(s);
 });
}

function updateCooldowns(){
 ['Q','E','F','R'].forEach(k=>{
  let el=document.querySelector('#skills .skill:nth-child('+({Q:1,E:2,F:3,R:4}[k])+') small');
  if(el){
   let left=Math.max(0,cooldown[k]-performance.now()/1000);
   el.textContent=left>0?left.toFixed(1)+'초':'사용 가능';
  }
 });
}

function gameOver(){
 if(dead)return;
 dead=true;
 running=false;
 document.exitPointerLock?.();
 $('dead').style.display='flex';
 $('resultText').textContent='생존 시간: '+Math.floor(gameTime)+'초 · 처치: '+player.kills+' · 도달 레벨: '+player.level;
}

function animate(){
 if(!running)return;
 requestAnimationFrame(animate);
 let dt=Math.min(clock.getDelta(),.05);
 if(!paused&&!dead){
  gameTime+=dt;
  updateMovement(dt);
  updateEnemies(dt);
  updateProjectiles(dt);
  updateParticles(dt);
  updateSupplies();

  spawnClock+=dt;
  supplyClock+=dt;
  if(spawnClock>Math.max(.65,2.4-gameTime*.006)){
   spawnClock=0;
   if(enemies.length<45)makeEnemy();
  }
  if(supplyClock>=45){
   supplyClock=0;
   spawnSupply();
  }
  if(messageTimer>0){
   messageTimer-=dt*1000;
   if(messageTimer<=0)$('message').textContent='';
  }
  updateCooldowns();
  updateHUD();
 }
 renderer.render(scene,camera);
}

function keyDown(e){
 keys[e.code]=true;
 if(e.repeat)return;
 if(['KeyQ','KeyE','KeyF','KeyR','Space'].includes(e.code))e.preventDefault();
 if(e.code==='KeyQ')useSkill('Q');
 if(e.code==='KeyE')useSkill('E');
 if(e.code==='KeyF')useSkill('F');
 if(e.code==='KeyR')useSkill('R');
 if(e.code==='Space')attack();
}
function keyUp(e){keys[e.code]=false;}

document.addEventListener('keydown',keyDown);
document.addEventListener('keyup',keyUp);

document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement&&running&&!paused){
  yaw-=e.movementX*.002;
  pitch-=e.movementY*.002;
  pitch=Math.max(-1.35,Math.min(1.35,pitch));
  camera.rotation.order='YXZ';
  camera.rotation.set(pitch,yaw,0);
 }
});

document.addEventListener('mousedown',e=>{
 if(e.button===0&&running&&!paused&&innerWidth>700)attack();
});

$('startBtn').addEventListener('click',()=>{
 try{
  startGame();
 }catch(error){
  console.error(error);
  alert('게임 시작 오류: '+error.message);
 }
});

$('restartBtn').addEventListener('click',()=>{
 location.reload();
});

document.querySelectorAll('#mobileSkills button').forEach(btn=>{
 btn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  useSkill(btn.dataset.skill);
 });
});

const stick=$('stick');
const knob=$('knob');

stick.addEventListener('pointerdown',e=>{
 joystickActive=true;
 stick.setPointerCapture(e.pointerId);
 moveJoystick(e);
});
stick.addEventListener('pointermove',e=>{
 if(joystickActive)moveJoystick(e);
});
stick.addEventListener('pointerup',()=>{
 joystickActive=false;
 moveInput={x:0,y:0};
 knob.style.left='35px';
 knob.style.top='35px';
});
stick.addEventListener('pointercancel',()=>{
 joystickActive=false;
 moveInput={x:0,y:0};
 knob.style.left='35px';
 knob.style.top='35px';
});

function moveJoystick(e){
 let r=stick.getBoundingClientRect();
 let cx=r.left+r.width/2;
 let cy=r.top+r.height/2;
 let dx=e.clientX-cx;
 let dy=e.clientY-cy;
 let len=Math.sqrt(dx*dx+dy*dy);
 let max=37;
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 knob.style.left=(35+dx)+'px';
 knob.style.top=(35+dy)+'px';
 moveInput.x=dx/max;
 moveInput.y=-dy/max;
}

$('look').addEventListener('pointerdown',e=>{
 lookTouch=e.pointerId;
 $('look').setPointerCapture(e.pointerId);
});
$('look').addEventListener('pointermove',e=>{
 if(lookTouch!==e.pointerId||!running||paused)return;
 yaw-=e.movementX*.004;
 pitch-=e.movementY*.004;
 pitch=Math.max(-1.35,Math.min(1.35,pitch));
 camera.rotation.order='YXZ';
 camera.rotation.set(pitch,yaw,0);
});
$('look').addEventListener('pointerup',()=>lookTouch=null);
$('look').addEventListener('pointercancel',()=>lookTouch=null);

window.addEventListener('contextmenu',e=>e.preventDefault());

updateHUD();
</script>
</body>
</html>
