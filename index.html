<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zentix - ABILITY WAR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:white;font-family:Arial,sans-serif}
button{font:inherit;cursor:pointer;color:white;border:1px solid #3978f6;background:rgba(20,35,65,.9);border-radius:10px}
button:active{transform:scale(.96)}
#game{position:fixed;inset:0}
#game canvas{display:block}
#startScreen,#loadingScreen,#cardScreen,#ultimateScreen,#gameOver{
 position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at center,rgba(20,42,85,.78),rgba(3,5,12,.98));
}
.panel{width:min(92%,520px);padding:34px 25px;text-align:center;border:1px solid #315da8;
 background:rgba(7,12,25,.94);border-radius:20px;box-shadow:0 0 45px #153a7770}
.logo{font-size:clamp(48px,12vw,78px);font-weight:1000;letter-spacing:7px;color:#6da4ff;text-shadow:0 0 25px #3978f6}
.sub{letter-spacing:5px;color:#a9c7ff;font-size:13px;margin:8px 0 28px}
.desc{color:#aab6ca;line-height:1.8;font-size:14px;margin:20px 0}
.bigbtn{width:100%;padding:17px;font-size:19px;font-weight:bold;background:linear-gradient(100deg,#2456c7,#398dff);border:0;box-shadow:0 0 25px #2866df66}
.small{font-size:12px;color:#8092b3;margin-top:15px}
.hidden{display:none!important}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
#topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px}
.hudbox{background:#080e1ddd;border:1px solid #28477b;border-radius:10px;padding:9px 13px;font-size:13px;backdrop-filter:blur(8px)}
#healthWrap{position:absolute;left:50%;top:17px;transform:translateX(-50%);width:min(38%,300px)}
.bar{height:12px;background:#20283a;border-radius:20px;overflow:hidden;border:1px solid #52617d}
#healthBar{height:100%;width:100%;background:linear-gradient(90deg,#d52d4b,#ff657b)}
#xpWrap{position:absolute;left:0;right:0;bottom:0;height:5px;background:#18243a}
#xpBar{height:100%;width:0;background:#4c9dff;box-shadow:0 0 12px #398dff}
#skillbar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:9px}
.skill{width:65px;height:65px;background:#0a1325dd;border:1px solid #4675c5;border-radius:12px;text-align:center;padding:6px;pointer-events:auto;position:relative}
.skill b{font-size:20px;display:block;color:#8bb8ff}
.skill span{font-size:10px;color:#b9c8e2}
.cool{position:absolute;inset:0;background:#02050acc;display:none;align-items:center;justify-content:center;border-radius:12px;font-size:18px}
#skillbar .skill.disabled .cool{display:flex}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;color:#b8d5ff;text-shadow:0 0 8px #3978f6}
#notice{position:absolute;top:23%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:bold;color:#b9d7ff;text-shadow:0 0 15px #3978f6;white-space:nowrap;text-align:center}
#mobileControls{display:none;pointer-events:none}
#joystick{position:absolute;bottom:105px;left:24px;width:115px;height:115px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff55;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:34px;top:34px;width:46px;height:46px;border-radius:50%;background:#8bb8ff88;border:1px solid #b8d5ff}
#mobileSkills{position:absolute;right:16px;bottom:100px;display:flex;flex-direction:column;gap:9px;pointer-events:auto}
#mobileSkills button{width:58px;height:48px;background:#101e3ddd;font-weight:bold}
#mobileSkills button span{display:block;font-size:9px;color:#b8c9e8}
#supplyText{position:absolute;top:75px;left:50%;transform:translateX(-50%);font-size:12px;color:#ffdb8a}
#cardScreen,#ultimateScreen{z-index:12;background:#030711eF}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.card{padding:17px 12px;text-align:left;min-height:130px;background:linear-gradient(145deg,#142441,#080e1b);border:1px solid #416bb1;border-radius:12px}
.card h3{margin:0 0 10px;color:#a9ccff;font-size:16px}
.card p{font-size:12px;color:#b6c2d7;line-height:1.6;margin:0}
.rarity{font-size:10px;color:#70a7ff;margin-bottom:8px}
#gameOver .panel h1{font-size:38px}
@media(max-width:700px){
 #mobileControls{display:block}
 #skillbar{display:none}
 #healthWrap{top:65px;width:55%}
 #topbar{font-size:11px}
 #joystick{bottom:25px}
 #mobileSkills{bottom:24px}
 .cards{grid-template-columns:1fr}
 .panel{max-height:90vh;overflow:auto}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="startScreen">
 <div class="panel">
  <div class="logo">ZENTIX</div>
  <div class="sub">ABILITY WAR</div>
  <div class="desc">
   끝없이 몰려오는 적을 처치하고<br>
   증강을 획득해 더욱 강해져라.<br><br>
   <b>생존 모드 · 사무라이</b>
  </div>
  <button class="bigbtn" id="startBtn">전투 시작</button>
  <div class="small">PC: WASD 이동 · 마우스 시점 · 좌클릭 공격<br>모바일: 왼쪽 이동 · 오른쪽 화면 회전 · 스킬 버튼</div>
 </div>
</div>

<div id="loadingScreen" class="hidden">
 <div class="panel"><h2>전투 준비 중...</h2><p id="loadingText">Zentix 초기화 중</p></div>
</div>

<div id="hud" class="hidden">
 <div id="topbar">
  <div class="hudbox">LV <b id="level">1</b>　 처치 <b id="kills">0</b></div>
  <div class="hudbox">체력 <b id="hpText">100 / 100</b></div>
  <div class="hudbox">생존 <b id="timeText">00:00</b></div>
 </div>
 <div id="healthWrap"><div class="bar"><div id="healthBar"></div></div></div>
 <div id="crosshair">+</div>
 <div id="notice"></div>
 <div id="supplyText"></div>
 <div id="skillbar">
  <button class="skill" data-skill="Q"><b>Q</b><span>발도술</span><div class="cool"></div></button>
  <button class="skill" data-skill="E"><b>E</b><span>회전참</span><div class="cool"></div></button>
  <button class="skill" data-skill="F"><b>F</b><span>비검</span><div class="cool"></div></button>
  <button class="skill" data-skill="R"><b>R</b><span>궁극기</span><div class="cool"></div></button>
 </div>
 <div id="mobileControls">
  <div id="joystick"><div id="stick"></div></div>
  <div id="mobileSkills">
   <button data-skill="Q">Q<span>발도술</span></button>
   <button data-skill="E">E<span>회전참</span></button>
   <button data-skill="F">F<span>비검</span></button>
   <button data-skill="R">R<span>궁극기</span></button>
   <button id="mobileAttack">⚔<span>공격</span></button>
  </div>
 </div>
 <div id="xpWrap"><div id="xpBar"></div></div>
</div>

<div id="ultimateScreen" class="hidden">
 <div class="panel">
  <h2>궁극기 선택</h2>
  <p class="desc">R 슬롯에 장착할 궁극기를 하나 선택해.</p>
  <div class="cards" id="ultimateCards"></div>
 </div>
</div>

<div id="cardScreen" class="hidden">
 <div class="panel">
  <h2>LEVEL UP</h2>
  <p class="desc">증강 하나를 선택해 사무라이를 강화해.</p>
  <div class="cards" id="augmentCards"></div>
 </div>
</div>

<div id="gameOver" class="hidden">
 <div class="panel">
  <h1>전투 종료</h1>
  <p id="resultText" class="desc"></p>
  <button class="bigbtn" id="restartBtn">다시 도전</button>
 </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* =========================
   Zentix - Survival Mode
========================= */

const $ = id => document.getElementById(id);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080d19);
scene.fog = new THREE.Fog(0x080d19, 22, 85);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, .1, 150);
camera.position.set(0,1.7,5);

let renderer;
try{
 renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.shadowMap.enabled = true;
 renderer.shadowMap.type = THREE.PCFSoftShadowMap;
 $("game").appendChild(renderer.domElement);
}catch(e){
 $("loadingText").textContent="3D 화면을 초기화하지 못했어. 브라우저에서 WebGL을 지원하는지 확인해줘.";
 throw e;
}

scene.add(new THREE.HemisphereLight(0x9bbcff,0x171321,1.5));
const sun = new THREE.DirectionalLight(0xffffff,2.1);
sun.position.set(-8,15,7);
sun.castShadow=true;
scene.add(sun);

const clock = new THREE.Clock();
const player = {
 pos:new THREE.Vector3(0,0,5),
 hp:100,maxHp:100,level:1,xp:0,nextXp:30,
 speed:7,damage:24,range:3.6,
 alive:false,invuln:0
};

let gameStarted=false, paused=false, gameTime=0, kills=0;
let yaw=0,pitch=0;
let enemies=[], projectiles=[], particles=[], supplies=[];
let attackTimer=0, spawnTimer=0, supplyTimer=22;
let noticeTimer=0, swordSwing=0, ultAnimation=0;
let selectedUltimate=null;
let moveForward=0,moveSide=0;
let keys={};
let touchLook=null;
let joystickActive=false, joyX=0,joyY=0;
let mouseDown=false;

const cooldown={Q:0,E:0,F:0,R:0};
const cooldownMax={Q:5,E:8,F:6,R:22};
const aug={
 qPower:0,qRange:0,ePower:0,eExtra:0,fPower:0,fSpeed:0,
 ultPower:0,damage:0,attackSpeed:0,moveSpeed:0,
 maxHp:0,lifeSteal:0,crit:0,weapon:0
};
const acquired=new Set();

const mat=(color,roughness=.65,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const floorMat=mat(0x172033);
const enemyMat=mat(0x8d263f);
const enemyDark=mat(0x29101c);
const blueMat=mat(0x367eff,.35,.3);
const goldMat=mat(0xffc45c,.3,.55);

/* Ground and arena */
const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),floorMat);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.05;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(180,90,0x315080,0x1b2b48);
grid.position.y=.005;
scene.add(grid);

for(let i=0;i<36;i++){
 const a=i*Math.PI*2/36;
 const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,4,8),mat(0x202c43));
 pillar.position.set(Math.cos(a)*27,2,Math.sin(a)*27);
 pillar.castShadow=true;
 scene.add(pillar);
 const lamp=new THREE.PointLight(0x3978ff,1.1,8);
 lamp.position.set(Math.cos(a)*27,3.5,Math.sin(a)*27);
 scene.add(lamp);
}

/* First-person arm and katana */
const weaponGroup=new THREE.Group();
camera.add(weaponGroup);
scene.add(camera);
weaponGroup.position.set(.48,-.43,-.8);

const sleeve=new THREE.Mesh(new THREE.CylinderGeometry(.13,.17,.65,10),mat(0x182d55));
sleeve.rotation.z=-.55;
sleeve.position.set(-.02,-.12,.12);
weaponGroup.add(sleeve);

const hand=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),mat(0xd7a17c));
hand.position.set(.02,.12,-.04);
weaponGroup.add(hand);

const guard=new THREE.Mesh(new THREE.TorusGeometry(.13,.025,8,16),goldMat);
guard.position.set(.02,.17,-.14);
guard.rotation.x=Math.PI/2;
weaponGroup.add(guard);

const handle=new THREE.Mesh(new THREE.CylinderGeometry(.045,.05,.42,8),mat(0x171923));
handle.position.set(.02,.16,.08);
handle.rotation.x=Math.PI/2;
weaponGroup.add(handle);

const blade=new THREE.Mesh(new THREE.BoxGeometry(.065,.045,1.05),mat(0xd9e8ff,.2,.85));
blade.position.set(.02,.18,-.62);
weaponGroup.add(blade);

const bladeTip=new THREE.Mesh(new THREE.ConeGeometry(.035,.18,4),mat(0xe8f3ff,.2,.9));
bladeTip.rotation.x=-Math.PI/2;
bladeTip.position.set(.02,.18,-1.22);
weaponGroup.add(bladeTip);

/* Effects */
function particle(pos,color=0x75aaff,count=8,power=3,size=.08){
 for(let i=0;i<count;i++){
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,6,6),new THREE.MeshBasicMaterial({color,transparent:true}));
  mesh.position.copy(pos);
  const velocity=new THREE.Vector3((Math.random()-.5)*power,Math.random()*power,(Math.random()-.5)*power);
  scene.add(mesh);
  particles.push({mesh,velocity,life:.55+Math.random()*.45,max:.9});
 }
}

function slashEffect(pos,angle,color=0x8bbcff,scale=1){
 const group=new THREE.Group();
 const curve=new THREE.TorusGeometry(1.1,.045,6,32,Math.PI*.9);
 const arc=new THREE.Mesh(curve,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95}));
 group.add(arc);
 group.position.copy(pos);
 group.rotation.set(0,angle,0);
 group.scale.set(scale,scale,scale);
 scene.add(group);
 particles.push({mesh:group,velocity:new THREE.Vector3(0,.15,0),life:.22,max:.22,fade:true});
}

function hitFlash(pos){
 const flash=new THREE.Mesh(new THREE.SphereGeometry(.4,8,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.8}));
 flash.position.copy(pos);
 scene.add(flash);
 particles.push({mesh:flash,velocity:new THREE.Vector3(0,0,0),life:.12,max:.12,fade:true});
}

/* Enemy creation */
function createEnemy(){
 const angle=Math.random()*Math.PI*2;
 const distance=19+Math.random()*13;
 const group=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CylinderGeometry(.42,.5,1.15,8),enemyMat);
 body.position.y=.9;
 body.castShadow=true;
 group.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,10,8),enemyDark);
 head.position.y=1.72;
 group.add(head);
 const eyeMat=new THREE.MeshBasicMaterial({color:0xff526d});
 for(const x of [-.12,.12]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),eyeMat);
  eye.position.set(x,1.77,-.27);
  group.add(eye);
 }
 const hpBack=new THREE.Mesh(new THREE.BoxGeometry(1.1,.09,.04),mat(0x260b17));
 hpBack.position.y=2.2;
 group.add(hpBack);
 const hpFront=new THREE.Mesh(new THREE.BoxGeometry(1.05,.07,.05),new THREE.MeshBasicMaterial({color:0xff526d}));
 hpFront.position.set(0,2.2,-.03);
 group.add(hpFront);
 group.position.set(player.pos.x+Math.cos(angle)*distance,0,player.pos.z+Math.sin(angle)*distance);
 scene.add(group);
 const hp=45+player.level*9;
 enemies.push({group,hp,maxHp:hp,speed:1.3+Math.random()*.45+player.level*.025,attack:0,hpFront});
}

function damageEnemy(enemy,amount,knock=0){
 if(!enemy || !enemies.includes(enemy)) return;
 enemy.hp-=amount;
 hitFlash(enemy.group.position.clone().add(new THREE.Vector3(0,1,0)));
 particle(enemy.group.position.clone().add(new THREE.Vector3(0,1,0)),0xff6680,5,2,.06);
 const ratio=Math.max(0,enemy.hp/enemy.maxHp);
 enemy.hpFront.scale.x=ratio;
 enemy.hpFront.position.x=-(1.05*(1-ratio))/2;
 if(enemy.hp<=0){
  scene.remove(enemy.group);
  enemies=enemies.filter(e=>e!==enemy);
  kills++;
  gainXp(10+Math.floor(player.level*.8));
  if(Math.random()<.12) player.hp=Math.min(player.maxHp,player.hp+2+player.lifeSteal);
  updateHud();
 }
}

function attack(){
 if(!gameStarted||paused||!player.alive||attackTimer>0)return;
 attackTimer=Math.max(.28,.58-aug.attackSpeed*.035);
 swordSwing=.32;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 let hit=false;
 for(const e of [...enemies]){
  const to=e.group.position.clone().sub(player.pos);
  const dist=to.length();
  to.normalize();
  if(dist<player.range+aug.qRange*.25 && forward.dot(to)>.05){
   damageEnemy(e,player.damage+aug.damage+aug.weapon*5);
   hit=true;
  }
 }
 const p=player.pos.clone().add(forward.multiplyScalar(1.4));
 slashEffect(p,yaw,0xb5d7ff,1);
 if(hit) particle(p,0xffffff,4,1,.05);
}

/* Skills */
function useSkill(key){
 if(!gameStarted||paused||!player.alive||cooldown[key]>0)return;
 if(key==="Q"){
  cooldown.Q=Math.max(1.8,cooldownMax.Q-aug.qPower*.35);
  swordSwing=.55;
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const center=player.pos.clone().add(forward.clone().multiplyScalar(2.2));
  slashEffect(center,yaw,0xff526d,1.8+aug.qRange*.15);
  for(const e of [...enemies]){
   const d=e.group.position.distanceTo(center);
   if(d<3.2+aug.qRange*.35) damageEnemy(e,65+aug.qPower*24+aug.damage,1);
  }
  particle(center,0xff536d,18,5,.09);
  notify(aug.qPower?"발도술 · 강화":"발도술");
 }
 if(key==="E"){
  cooldown.E=Math.max(3,cooldownMax.E-aug.ePower*.5);
  swordSwing=.7;
  for(let n=0;n<2+aug.eExtra;n++){
   setTimeout(()=>{
    if(!player.alive)return;
    const center=player.pos.clone();
    slashEffect(center,yaw+n*.8,0x65baff,2.1);
    for(const e of [...enemies]){
     if(e.group.position.distanceTo(player.pos)<4.5) damageEnemy(e,36+aug.ePower*17+aug.damage);
    }
    particle(center,0x8acaff,14,4,.07);
   },n*170);
  }
  notify("회전참");
 }
 if(key==="F"){
  cooldown.F=Math.max(2,cooldownMax.F-aug.fPower*.4);
  const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(.12,.09,1.2),mat(0xcde5ff,.15,.8));
  mesh.position.copy(player.pos).add(new THREE.Vector3(0,1.25,0)).add(dir.clone().multiplyScalar(1.2));
  mesh.rotation.y=yaw;
  scene.add(mesh);
  projectiles.push({mesh,dir,speed:17+aug.fSpeed*3,life:2.4,damage:55+aug.fPower*25+aug.damage});
  particle(mesh.position,0x9ccfff,8,2,.05);
  notify("비검");
 }
 if(key==="R"){
  if(!selectedUltimate){openUltimate();return}
  cooldown.R=cooldownMax.R;
  ultAnimation=1.8;
  paused=true;
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;z-index:9;background:rgba(2,4,12,.78);pointer-events:none";
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.remove(),550);
  notify(selectedUltimate.name);
  setTimeout(()=>{
   const center=player.pos.clone();
   if(selectedUltimate.id==="petal"){
    for(let i=0;i<18;i++){
     const p=center.clone().add(new THREE.Vector3((Math.random()-.5)*17,Math.random()*4,(Math.random()-.5)*17));
     particle(p,0xff9cbd,4,2,.12);
    }
    for(const e of [...enemies]) if(e.group.position.distanceTo(center)<13) damageEnemy(e,180+aug.ultPower*45);
    slashEffect(center,yaw,0xff9ac1,8);
   }else if(selectedUltimate.id==="blood"){
    for(const e of [...enemies]) if(e.group.position.distanceTo(center)<11) damageEnemy(e,240+aug.ultPower*50);
    particle(center,0xff173e,65,9,.13);
    slashEffect(center,yaw,0xff234c,7);
   }else{
    for(const e of [...enemies]) if(e.group.position.distanceTo(center)<16) damageEnemy(e,150+aug.ultPower*50);
    particle(center,0x6db9ff,70,10,.12);
    slashEffect(center,yaw,0x5aabff,10);
   }
   paused=false;
  },650);
 }
 updateHud();
}

/* Experience and level-ups */
function gainXp(amount){
 player.xp+=amount;
 while(player.xp>=player.nextXp){
  player.xp-=player.nextXp;
  player.level++;
  player.nextXp=Math.floor(player.nextXp*1.32+10);
  openAugments();
 }
 updateHud();
}

const augmentPool=[
 {id:"qPower",name:"발도술 강화",rarity:"희귀",desc:"Q 발도술 피해량 증가",apply:()=>aug.qPower++},
 {id:"qRange",name:"발도술 확장",rarity:"영웅",desc:"Q 발도술 범위 증가",apply:()=>aug.qRange++},
 {id:"ePower",name:"회전참 강화",rarity:"희귀",desc:"E 회전참 피해량 증가",apply:()=>aug.ePower++},
