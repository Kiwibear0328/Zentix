<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZENTIX - ABILITY WAR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#08090d;color:white;font-family:Arial,sans-serif;touch-action:none}
button{color:white;border:0;cursor:pointer;font-weight:bold;touch-action:manipulation}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(9,13,24,.88);border:1px solid #30486d;border-radius:12px}
#topbar{position:absolute;top:14px;left:14px;padding:12px 16px}
#logo{font-size:23px;letter-spacing:4px;font-weight:1000;color:#65a5ff}
#stats{font-size:12px;line-height:1.8;color:#c7d6ef}
#healthBox{position:absolute;right:14px;top:14px;width:200px;padding:11px;font-size:12px}
.bar{height:9px;background:#252b38;border-radius:10px;overflow:hidden;margin-top:5px}
.fill{height:100%;width:100%;transition:width .2s}
#hpFill{background:linear-gradient(90deg,#d72f4d,#ff7185)}
#xpFill{background:linear-gradient(90deg,#3477e8,#76b8ff)}
#crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid white;border-radius:50%;transform:translate(-50%,-50%)}
#message{position:absolute;top:23%;width:100%;text-align:center;font-size:25px;font-weight:900;text-shadow:0 2px 10px black}
#skills{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:9px}
.skill{width:65px;height:65px;border:1px solid #5279aa;background:#101a2c;border-radius:12px;text-align:center;padding-top:8px}
.skill b{font-size:22px;color:#83b8ff}
.skill small{display:block;font-size:10px;margin-top:5px;color:#d1dced}
#startScreen,#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#192c4d,#08090d 72%)}
.card{width:min(92%,530px);padding:28px;text-align:center;background:rgba(9,13,24,.97);border:1px solid #35578d;border-radius:20px;box-shadow:0 0 60px #102c55}
.title{font-size:48px;font-weight:1000;letter-spacing:8px;color:#69aaff}
.subtitle{letter-spacing:5px;color:#a8bad8;margin:8px 0 25px}
.description{font-size:13px;color:#aab8ce;line-height:1.8}
.primary{background:linear-gradient(100deg,#2365d9,#459aff);padding:15px 35px;border-radius:10px;font-size:17px;margin-top:18px}
#overlay{display:none;background:#02040add}
#choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.choice{width:145px;min-height:145px;padding:13px;background:#111e34;border:1px solid #45618a;border-radius:12px;text-align:left}
.choice strong{display:block;color:#80b4ff;margin-bottom:9px}
.choice span{font-size:12px;line-height:1.5;color:#d2dced}
#mobile{display:none;position:fixed;inset:0;z-index:5;pointer-events:none}
#stick{position:absolute;left:20px;bottom:25px;width:125px;height:125px;border-radius:50%;background:#182b4c99;border:2px solid #80baffaa;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:49px;height:49px;border-radius:50%;background:#75adffdd;border:2px solid #d4e7ff}
#look{position:absolute;right:0;top:0;width:58%;height:75%;pointer-events:auto;touch-action:none}
#mobileSkills{position:absolute;right:15px;bottom:24px;display:grid;grid-template-columns:repeat(2,64px);gap:9px;pointer-events:auto}
#mobileSkills button{width:64px;height:64px;border-radius:15px;background:linear-gradient(145deg,#1a3154,#0c172a);border:2px solid #6396db;font-size:21px;box-shadow:0 4px 14px #0008}
#mobileSkills button:active{background:#3978cf;transform:scale(.94)}
#mobileSkills .attack{grid-column:1/3;width:137px;height:66px;background:linear-gradient(120deg,#a52c45,#e34d63);border-color:#ff8b9c;font-size:19px}
#damageFlash{position:fixed;inset:0;pointer-events:none;background:#ff1733;opacity:0;z-index:4}
#dead{display:none;position:fixed;inset:0;z-index:20;background:#08090df2;align-items:center;justify-content:center}
@media(max-width:700px){
 #mobile{display:block}
 #topbar{top:7px;left:7px;padding:8px}
 #logo{font-size:17px}
 #stats{font-size:10px}
 #healthBox{top:7px;right:7px;width:145px;padding:8px;font-size:10px}
 #skills{display:none}
 #message{top:20%;font-size:20px}
 #crosshair{width:6px;height:6px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="topbar" class="panel">
  <div id="logo">ZENTIX</div>
  <div id="stats">
   ABILITY WAR · SURVIVAL<br>
   LEVEL <b id="level">1</b>　KILL <b id="kills">0</b><br>
   생존 시간 <b id="time">0:00</b>
  </div>
 </div>
 <div id="healthBox" class="panel">
  체력 <b id="hpText">100 / 100</b>
  <div class="bar"><div id="hpFill" class="fill"></div></div>
  경험치 <b id="xpText">0 / 100</b>
  <div class="bar"><div id="xpFill" class="fill"></div></div>
 </div>
 <div id="crosshair"></div>
 <div id="message"></div>
 <div id="skills">
  <div class="skill"><b>Q</b><small>발도술</small></div>
  <div class="skill"><b>E</b><small>회전참</small></div>
  <div class="skill"><b>F</b><small>비검</small></div>
  <div class="skill"><b>R</b><small>궁극기</small></div>
 </div>
</div>
<div id="damageFlash"></div>

<div id="startScreen">
 <div class="card">
  <div class="title">ZENTIX</div>
  <div class="subtitle">ABILITY WAR</div>
  <p class="description">끝없이 몰려오는 적을 처치하고<br>증강을 선택해 최강의 사무라이로 성장하라.</p>
  <p class="description">PC: WASD 이동 · 마우스 시점 · 좌클릭 공격</p>
  <button class="primary" id="startBtn">전투 시작</button>
  <p class="description">모바일: 왼쪽 이동 · 오른쪽 시점 및 공격 버튼</p>
 </div>
</div>

<div id="overlay">
 <div class="card">
  <div class="title" id="overlayTitle" style="font-size:30px;letter-spacing:3px">선택</div>
  <p class="description" id="overlayDesc"></p>
  <div id="choices"></div>
 </div>
</div>

<div id="mobile">
 <div id="stick"><div id="knob"></div></div>
 <div id="look"></div>
 <div id="mobileSkills">
  <button data-skill="Q">Q</button>
  <button data-skill="E">E</button>
  <button data-skill="F">F</button>
  <button data-skill="R">R</button>
  <button class="attack" data-skill="ATTACK">⚔ 공격</button>
 </div>
</div>

<div id="dead">
 <div class="card">
  <div class="title" style="font-size:38px">DEFEATED</div>
  <p id="resultText"></p>
  <button class="primary" id="restartBtn">다시 도전</button>
 </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
let scene,camera,renderer,clock;
let running=false,paused=false,dead=false;
let player={hp:100,maxHp:100,speed:7,damage:25,level:1,xp:0,nextXp:100,kills:0};
let enemies=[],particles=[],projectiles=[],supplies=[];
let keys={},yaw=0,pitch=0,lastAttack=0,gameTime=0,spawnClock=0,supplyClock=0;
let passive={damage:0,speed:0,maxHp:0,heal:0};
let augments=new Set(),skillLevel={Q:0,E:0,F:0,R:0};
let cooldown={Q:0,E:0,F:0,R:0};
let ultimate='낙화천풍',weaponLevel=1;
let moveInput={x:0,y:0},joystickActive=false,lookTouch=null;
let swordPivot,sword,messageTimer=0;

function showMessage(t,d=1400){
 $('message').textContent=t;messageTimer=d;
}
function updateHUD(){
 $('level').textContent=player.level;
 $('kills').textContent=player.kills;
 $('hpText').textContent=Math.ceil(player.hp)+' / '+player.maxHp;
 $('hpFill').style.width=Math.max(0,player.hp/player.maxHp*100)+'%';
 $('xpText').textContent=player.xp+' / '+player.nextXp;
 $('xpFill').style.width=player.xp/player.nextXp*100+'%';
 $('time').textContent=Math.floor(gameTime/60)+':'+String(Math.floor(gameTime%60)).padStart(2,'0');
}

function init3D(){
 if(!window.THREE){alert('3D 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');return false;}
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x090d18);
 scene.fog=new THREE.Fog(0x090d18,25,90);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
 camera.position.set(0,1.7,5);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
 $('game').appendChild(renderer.domElement);
 clock=new THREE.Clock();
 scene.add(new THREE.HemisphereLight(0xaacaff,0x17111c,1.5));
 let light=new THREE.DirectionalLight(0xffffff,1.4);
 light.position.set(-8,15,7);scene.add(light);

 let floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),
  new THREE.MeshStandardMaterial({color:0x171d2a,roughness:.9}));
 floor.rotation.x=-Math.PI/2;scene.add(floor);
 let grid=new THREE.GridHelper(180,90,0x263b5d,0x1c2b43);
 grid.position.y=.015;scene.add(grid);
 createEnvironment();createWeapon();
 window.addEventListener('resize',resize);
 return true;
}
function resize(){
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
}
function createEnvironment(){
 for(let i=0;i<45;i++){
  let a=Math.random()*Math.PI*2,r=20+Math.random()*55,h=2+Math.random()*5;
  let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.3,h,6),
   new THREE.MeshStandardMaterial({color:0x29232d}));
  trunk.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);scene.add(trunk);
  let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6,1),
   new THREE.MeshStandardMaterial({color:0x252c46,flatShading:true}));
  crown.position.set(trunk.position.x,h+1,trunk.position.z);scene.add(crown);
 }
}
function createWeapon(){
 swordPivot=new THREE.Group();camera.add(swordPivot);
 swordPivot.position.set(.48,-.43,-.85);
 let hand=new THREE.Mesh(new THREE.BoxGeometry(.16,.22,.28),
  new THREE.MeshStandardMaterial({color:0xc69b7a}));
 hand.position.set(0,-.1,.1);swordPivot.add(hand);
 let grip=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.42,8),
  new THREE.MeshStandardMaterial({color:0x171a22}));
 grip.rotation.z=Math.PI/2;grip.position.set(0,-.04,-.17);swordPivot.add(grip);
 let guard=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.035,12),
  new THREE.MeshStandardMaterial({color:0xb5a16d,metalness:.7}));
 guard.rotation.z=Math.PI/2;guard.position.set(0,-.04,-.39);swordPivot.add(guard);
 sword=new THREE.Mesh(new THREE.BoxGeometry(.055,.035,1.12),
  new THREE.MeshStandardMaterial({color:0xdce8f5,metalness:.85,roughness:.2}));
 sword.position.set(0,-.04,-.95);swordPivot.add(sword);
}
function getForward(){
 let d=new THREE.Vector3();camera.getWorldDirection(d);d.y=0;return d.normalize();
}
function makeEnemy(){
 let a=Math.random()*Math.PI*2,dist=19+Math.random()*10;
 let group=new THREE.Group();
 let body=new THREE.Mesh(new THREE.CylinderGeometry(.38,.48,1.25,8),
  new THREE.MeshStandardMaterial({color:0x8b3048}));
 body.position.y=.85;group.add(body);
 let head=new THREE.Mesh(new THREE.SphereGeometry(.32,10,8),
  new THREE.MeshStandardMaterial({color:0xc18d83}));
 head.position.y=1.68;group.add(head);
 let eyes=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),
  new THREE.MeshBasicMaterial({color:0xff394e}));
 eyes.position.set(0,1.72,-.27);group.add(eyes);
 group.position.set(camera.position.x+Math.cos(a)*dist,0,camera.position.z+Math.sin(a)*dist);
 scene.add(group);
 enemies.push({mesh:group,hp:55+player.level*9,speed:1.3+Math.random()*.7,hit:0});
}
function makeParticle(pos,color,size=.12,life=.5,velocity=null){
 let mesh=new THREE.Mesh(new THREE.SphereGeometry(size,6,6),
  new THREE.MeshBasicMaterial({color,transparent:true,opacity:1}));
 mesh.position.copy(pos);scene.add(mesh);
 particles.push({mesh,life,max:life,velocity:velocity||new THREE.Vector3((Math.random()-.5)*3,Math.random()*2,(Math.random()-.5)*3)});
}
function slashArc(color,radius=1.4,life=.3){
 let dir=getForward();
 let mesh=new THREE.Mesh(new THREE.TorusGeometry(radius,.045,6,32,Math.PI),
  new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95}));
 mesh.position.copy(camera.position).add(dir.multiplyScalar(2.1));
 mesh.quaternion.copy(camera.quaternion);
 mesh.rotateZ(-.5);scene.add(mesh);
 particles.push({mesh,life,max:life,velocity:new THREE.Vector3(0,0,0)});
}
function damageEnemy(e,damage){
 if(!e||!e.mesh.parent)return;
 e.hp-=damage;
 for(let i=0;i<5;i++)makeParticle(e.mesh.position.clone().add(new THREE.Vector3(0,1,0)),0xff6677,.07,.3);
 if(e.hp<=0){
  scene.remove(e.mesh);enemies=enemies.filter(x=>x!==e);
  player.kills++;gainXP(22);
  if(passive.heal)player.hp=Math.min(player.maxHp,player.hp+passive.heal*2);
  updateHUD();
 }
}
function attack(){
 if(!running||paused||dead)return;
 let now=performance.now();
 if(now-lastAttack<420)return;
 lastAttack=now;
 swordPivot.rotation.z=-1.05;
 swordPivot.rotation.x=-.2;
 setTimeout(()=>{if(swordPivot){swordPivot.rotation.z=-.3;swordPivot.rotation.x=0}},170);
 slashArc(0xd9edff,1.05,.22);
 let dir=getForward();
 enemies.slice().forEach(e=>{
  let to=e.mesh.position.clone().sub(camera.position),d=to.length();
  to.y=0;to.normalize();
  if(d<4.3&&dir.dot(to)>.25)damageEnemy(e,player.damage+passive.damage);
 });
}
function useSkill(key){
 if(!running||paused||dead)return;
 if(key==='ATTACK'){attack();return;}
 let now=performance.now()/1000;
 if((cooldown[key]||0)>now){showMessage('재사용 대기 중',500);return;}
 let lv=skillLevel[key]||0,dir=getForward();
 if(key==='Q'){
  cooldown.Q=now+Math.max(2.5,6-lv*.5);
  swordPivot.rotation.z=-1.7;
  setTimeout(()=>{if(swordPivot)swordPivot.rotation.z=-.3},220);
  slashArc(0xff344e,2.1,.35);
  enemies.slice().forEach(e=>{
   let to=e.mesh.position.clone().sub(camera.position),d=to.length();to.y=0;to.normalize();
   if(d<10&&dir.dot(to)>.55)damageEnemy(e,75+lv*28+player.damage);
  });
  showMessage('발도술 · 일섬!',650);
 }else if(key==='E'){
  cooldown.E=now+Math.max(4,9-lv*.6);
  swordPivot.rotation.y=0;
  let spin=0;
  let spinTimer=setInterval(()=>{
   if(!swordPivot||dead){clearInterval(spinTimer);return;}
   spin++;swordPivot.rotation.y+=Math.PI*.8;
   slashArc(0x66d9ff,1.8,.22);
   if(spin>=2){
    clearInterval(spinTimer);swordPivot.rotation.y=0;
    for(let i=0;i<18;i++){
     let a=i/18*Math.PI*2;
     makeParticle(camera.position.clone().add(new THREE.Vector3(Math.cos(a)*3,1,Math.sin(a)*3)),0x8bdcff,.12,.55);
    }
   }
  },110);
  enemies.slice().forEach(e=>{
   if(e.mesh.position.distanceTo(camera.position)<5.8)damageEnemy(e,55+lv*20+player.damage*.7);
  });
  showMessage('회전참 · 연속 베기!',700);
 }else if(key==='F'){
  cooldown.F=now+Math.max(3,7-lv*.5);
  let p=new THREE.Group();
  let blade=new THREE.Mesh(new THREE.BoxGeometry(.08,.045,1.5),
   new THREE.MeshBasicMaterial({color:0xdceeff}));
  p.add(blade);
  let glow=new THREE.PointLight(0x77baff,1.5,3);p.add(glow);
  p.position.copy(camera.position).add(dir.clone().multiplyScalar(1.3));
  p.position.y-=.15;p.quaternion.copy(camera.quaternion);
  scene.add(p);
  projectiles.push({mesh:p,dir,speed:25,life:1.7,damage:65+lv*25});
  showMessage('비검 · 검기 발사!',650);
 }else if(key==='R'){
  cooldown.R=now+Math.max(12,22-lv*2);
  ultimateAttack();
 }
}
function ultimateAttack(){
 if(ultimate==='낙화천풍'){
  showMessage('낙화천풍 · 만개!',1700);
  for(let i=0;i<75;i++){
   let p=camera.position.clone().add(new THREE.Vector3((Math.random()-.5)*16,Math.random()*7-1,-4-Math.random()*12));
   makeParticle(p,0xffa6c7,.1,1.5,new THREE.Vector3(0,-.6,0));
  }
  slashArc(0xffb4d0,4,.6);
  enemies.slice().forEach(e=>{if(e.mesh.position.distanceTo(camera.position)<16)damageEnemy(e,200+player.damage*2)});
 }else if(ultimate==='혈월참'){
  showMessage('혈월참 · 붉은 달!',1500);
  slashArc(0xff153d,4,.5);
  slashArc(0xff7888,2.8,.4);
  enemies.slice().forEach(e=>{
   let to=e.mesh.position.clone().sub(camera.position),d=to.length();to.y=0;to.normalize();
   if(d<19&&getForward().dot(to)>.1)damageEnemy(e,250+player.damage*2);
  });
 }else{
  showMessage('천지혁명 · 충격파!',1500);
  for(let i=0;i<55;i++){
   let a=i/55*Math.PI*2;
   makeParticle(camera.position.clone().add(new THREE.Vector3(Math.cos(a)*5,1,Math.sin(a)*5)),0x8b9fff,.16,.8);
  }
  enemies.slice().forEach(e=>{if(e.mesh.position.distanceTo(camera.position)<12)damageEnemy(e,220+player.damage*2)});
 }
}
 function gainXP(amount){
 player.xp+=amount;
 while(player.xp>=player.nextXp){
  player.xp-=player.nextXp;
  player.level++;
  player.nextXp=Math.floor(player.nextXp*1.32);
  player.hp=Math.min(player.maxHp,player.hp+15);
  levelUp();
 }
 updateHUD();
}

const augmentPool=[
 {name:'날카로운 칼날',desc:'공격력이 15% 증가합니다.',type:'damage',rarity:'일반'},
 {name:'질풍의 발걸음',desc:'이동 속도가 12% 증가합니다.',type:'speed',rarity:'일반'},
 {name:'생명력 강화',desc:'최대 체력이 25 증가합니다.',type:'hp',rarity:'희귀'},
 {name:'흡혈의 검',desc:'적 처치 시 체력을 회복합니다.',type:'heal',rarity:'희귀'},
 {name:'발도술 강화',desc:'Q 스킬 피해량 증가.',type:'Q',rarity:'희귀'},
 {name:'회전참 강화',desc:'E 스킬 피해량 증가.',type:'E',rarity:'희귀'},
 {name:'비검 강화',desc:'F 스킬 피해량 증가.',type:'F',rarity:'영웅'},
 {name:'궁극의 힘',desc:'R 스킬 피해량 증가.',type:'R',rarity:'영웅'},
 {name:'무사의 투지',desc:'공격력이 추가로 증가합니다.',type:'damage2',rarity:'영웅'}
];

const awakeningPool=[
 {name:'발도술 · 극의',desc:'발도술의 피해량과 사거리가 크게 증가합니다.',type:'Q'},
 {name:'회전참 · 무한',desc:'회전참의 범위와 피해량이 증가합니다.',type:'E'},
 {name:'비검 · 천공',desc:'비검의 투사체 피해량이 크게 증가합니다.',type:'F'},
 {name:'낙화천풍 · 만개',desc:'궁극기의 피해량이 크게 증가합니다.',type:'R'}
];

function openChoices(title,desc,items,onPick){
 paused=true;
 $('overlayTitle').textContent=title;
 $('overlayDesc').textContent=desc;
 let box=$('choices');box.innerHTML='';
 $('overlay').style.display='flex';
 items.forEach(item=>{
  let b=document.createElement('button');
  b.className='choice';
  b.innerHTML='<strong>'+item.name+'</strong><span>'+item.desc+'</span><br><br><small style="color:#e6c879">'+(item.rarity||'증강')+'</small>';
  b.onclick=()=>{
   $('overlay').style.display='none';
   onPick(item);
   paused=false;
   updateHUD();
  };
  box.appendChild(b);
 });
}
function applyAugment(a,isAwakening=false){
 if(augments.has(a.name))return;
 augments.add(a.name);
 if(a.type==='damage')player.damage=Math.round(player.damage*1.15);
 else if(a.type==='damage2')player.damage+=12;
 else if(a.type==='speed')player.speed*=1.12;
 else if(a.type==='hp'){
  player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+25);
 }else if(a.type==='heal')passive.heal++;
 else if(['Q','E','F','R'].includes(a.type))skillLevel[a.type]++;
 showMessage((isAwakening?'★ 각성 획득! ':'증강 획득! ')+a.name,1800);
 updateHUD();
}
function levelUp(){
 showMessage('LEVEL UP!',1000);
 let pool=augmentPool.filter(a=>!augments.has(a.name));
 if(pool.length===0)pool=augmentPool.slice();
 let choices=[];
 while(choices.length<3&&pool.length){
  choices.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
 }
 openChoices('LEVEL UP','원하는 증강을 하나 선택하세요.',choices,a=>applyAugment(a));
}
function spawnSupply(){
 let a=Math.random()*Math.PI*2,d=12+Math.random()*18;
 let group=new THREE.Group();
 let box=new THREE.Mesh(new THREE.BoxGeometry(.9,.7,.9),
  new THREE.MeshStandardMaterial({color:0x3478df,metalness:.5}));
 box.position.y=.45;group.add(box);
 let lid=new THREE.Mesh(new THREE.BoxGeometry(1,.16,1),
  new THREE.MeshStandardMaterial({color:0x8cc7ff,metalness:.5}));
 lid.position.y=.88;group.add(lid);
 let glow=new THREE.PointLight(0x398aff,2,7);glow.position.y=1.3;group.add(glow);
 group.position.set(camera.position.x+Math.cos(a)*d,0,camera.position.z+Math.sin(a)*d);
 scene.add(group);supplies.push({mesh:group});
 showMessage('보급품이 생성되었습니다!',1500);
}
function collectSupply(s){
 scene.remove(s.mesh);supplies=supplies.filter(x=>x!==s);
 let available=awakeningPool.filter(a=>!augments.has(a.name));
 if(Math.random()<.15&&available.length){
  let a=available[Math.floor(Math.random()*available.length)];
  openChoices('★ 각성 보급품','각성 등장 확률 15%!',[{
   name:a.name,desc:a.desc,type:a.type,rarity:'각성'
  }],item=>applyAugment(item,true));
  return;
 }
 if(Math.random()<.5){
  weaponLevel++;player.damage+=8;
  showMessage('무기 강화! 공격력 증가 · 무기 Lv.'+weaponLevel,1800);
 }else{
  let pool=augmentPool.filter(a=>!augments.has(a.name));
  if(pool.length){
   let a=pool[Math.floor(Math.random()*pool.length)];
   openChoices('특별 보급품','보급품에서 증강을 발견했습니다.',[a],item=>applyAugment(item));
  }else{
   player.maxHp+=10;player.hp=Math.min(player.maxHp,player.hp+30);
   showMessage('체력 회복 및 최대 체력 증가!',1500);
  }
 }
 updateHUD();
}

function updateMovement(dt){
 let forward=getForward();
 let right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();
 let x=0,z=0;
 if(keys.KeyW)z+=1;if(keys.KeyS)z-=1;
 if(keys.KeyA)x-=1;if(keys.KeyD)x+=1;
 x+=moveInput.x;z+=moveInput.y;
 let move=new THREE.Vector3().addScaledVector(right,x).addScaledVector(forward,z);
 if(move.length()>1)move.normalize();
 camera.position.addScaledVector(move,player.speed*dt);
 camera.position.y=1.7;
}
function updateEnemies(dt){
 enemies.slice().forEach(e=>{
  let target=camera.position.clone();target.y=0;
  let dir=target.sub(e.mesh.position),distance=dir.length();
  if(distance>.01){
   dir.normalize();e.mesh.position.addScaledVector(dir,e.speed*dt);
   e.mesh.rotation.y=Math.atan2(dir.x,dir.z);
  }
  if(distance<1.55){
   e.hit-=dt;
   if(e.hit<=0){
    e.hit=.85;
    player.hp-=Math.max(2,7-passive.heal);
    $('damageFlash').style.opacity='.35';
    setTimeout(()=>$('damageFlash').style.opacity='0',100);
    if(player.hp<=0)gameOver();
    updateHUD();
   }
  }
 });
}
function updateProjectiles(dt){
 projectiles.slice().forEach(p=>{
  p.mesh.position.addScaledVector(p.dir,p.speed*dt);
  p.life-=dt;
  let hit=enemies.find(e=>e.mesh.position.distanceTo(p.mesh.position)<1);
  if(hit){
   damageEnemy(hit,p.damage);
   for(let i=0;i<10;i++)makeParticle(p.mesh.position.clone(),0x9bd5ff,.1,.4);
   p.life=0;
  }
  if(p.life<=0){
   scene.remove(p.mesh);projectiles=projectiles.filter(x=>x!==p);
  }
 });
}
function updateParticles(dt){
 particles.slice().forEach(p=>{
  p.life-=dt;
  p.mesh.position.addScaledVector(p.velocity,dt);
  p.mesh.material.opacity=Math.max(0,p.life/p.max);
  if(p.life<=0){
   scene.remove(p.mesh);particles=particles.filter(x=>x!==p);
  }
 });
}
function updateSupplies(){
 supplies.slice().forEach(s=>{
  s.mesh.rotation.y+=.01;
  if(s.mesh.position.distanceTo(camera.position)<2.5)collectSupply(s);
 });
}
function updateCooldowns(){
 ['Q','E','F','R'].forEach((k,i)=>{
  let el=document.querySelector('#skills .skill:nth-child('+(i+1)+') small');
  if(el){
   let left=Math.max(0,cooldown[k]-performance.now()/1000);
   el.textContent=left>0?left.toFixed(1)+'초':'사용 가능';
  }
 });
}
function gameOver(){
 if(dead)return;
 dead=true;running=false;
 document.exitPointerLock?.();
 $('dead').style.display='flex';
 $('resultText').textContent='생존 시간: '+Math.floor(gameTime)+'초 · 처치: '+player.kills+' · 레벨: '+player.level;
}
function animate(){
 if(!running)return;
 requestAnimationFrame(animate);
 let dt=Math.min(clock.getDelta(),.05);
 if(!paused&&!dead){
  gameTime+=dt;
  updateMovement(dt);
  updateEnemies(dt);
  updateProjectiles(dt);
  updateParticles(dt);
  updateSupplies();
  spawnClock+=dt;supplyClock+=dt;
  if(spawnClock>Math.max(.65,2.4-gameTime*.006)){
   spawnClock=0;
   if(enemies.length<45)makeEnemy();
  }
  if(supplyClock>=45){supplyClock=0;spawnSupply();}
  if(messageTimer>0){
   messageTimer-=dt*1000;
   if(messageTimer<=0)$('message').textContent='';
  }
  updateCooldowns();updateHUD();
 }
 renderer.render(scene,camera);
}

function startGame(){
 if(running)return;
 if(!init3D())return;
 running=true;paused=false;dead=false;
 $('startScreen').style.display='none';
 player={hp:100,maxHp:100,speed:7,damage:25,level:1,xp:0,nextXp:100,kills:0};
 passive={damage:0,speed:0,maxHp:0,heal:0};
 augments.clear();skillLevel={Q:0,E:0,F:0,R:0};
 cooldown={Q:0,E:0,F:0,R:0};
 ultimate='낙화천풍';weaponLevel=1;
 gameTime=0;spawnClock=0;supplyClock=0;
 enemies=[];particles=[];projectiles=[];supplies=[];
 yaw=0;pitch=0;camera.position.set(0,1.7,5);
 updateHUD();showMessage('생존 모드 시작!',1500);
 showUltimateChoice();
 renderer.domElement.addEventListener('click',()=>{
  if(running&&!paused&&innerWidth>700&&document.pointerLockElement!==renderer.domElement){
   renderer.domElement.requestPointerLock?.();
  }
 });
 animate();
}
function showUltimateChoice(){
 paused=true;
 openChoices('궁극기 선택','R 슬롯에 장착할 궁극기를 선택하세요.',[
  {name:'낙화천풍',desc:'벚꽃이 휘날리며 거대한 일섬을 날립니다.',rarity:'전설'},
  {name:'혈월참',desc:'붉은 검격으로 전방을 가릅니다.',rarity:'전설'},
  {name:'천지혁명',desc:'주변에 강력한 충격파를 일으킵니다.',rarity:'전설'}
 ],item=>{ultimate=item.name;showMessage(ultimate+' 장착 완료!',1400);});
}

document.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.repeat)return;
 if(['KeyQ','KeyE','KeyF','KeyR','Space'].includes(e.code))e.preventDefault();
 if(e.code==='KeyQ')useSkill('Q');
 if(e.code==='KeyE')useSkill('E');
 if(e.code==='KeyF')useSkill('F');
 if(e.code==='KeyR')useSkill('R');
 if(e.code==='Space')attack();
});
document.addEventListener('keyup',e=>keys[e.code]=false);

document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement&&running&&!paused){
  yaw-=e.movementX*.002;
  pitch-=e.movementY*.002;
  pitch=Math.max(-1.35,Math.min(1.35,pitch));
  camera.rotation.order='YXZ';
  camera.rotation.set(pitch,yaw,0);
 }
});
document.addEventListener('mousedown',e=>{
 if(e.button===0&&running&&!paused&&innerWidth>700)attack();
});
$('startBtn').addEventListener('click',()=>{
 try{startGame()}catch(e){console.error(e);alert('게임 시작 오류: '+e.message)}
});
$('restartBtn').addEventListener('click',()=>location.reload());

document.querySelectorAll('#mobileSkills button').forEach(btn=>{
 btn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  e.stopPropagation();
  useSkill(btn.dataset.skill);
 });
});

const stick=$('stick'),knob=$('knob');
stick.addEventListener('pointerdown',e=>{
 e.preventDefault();joystickActive=true;
 stick.setPointerCapture(e.pointerId);moveJoystick(e);
});
stick.addEventListener('pointermove',e=>{
 if(joystickActive)moveJoystick(e);
});
function resetJoystick(){
 joystickActive=false;moveInput={x:0,y:0};
 knob.style.left='36px';knob.style.top='36px';
}
stick.addEventListener('pointerup',resetJoystick);
stick.addEventListener('pointercancel',resetJoystick);
function moveJoystick(e){
 let r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 let len=Math.hypot(dx,dy),max=38;
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 knob.style.left=(36+dx)+'px';
 knob.style.top=(36+dy)+'px';
 moveInput.x=dx/max;
 moveInput.y=-dy/max;
}

let lastLookX=0,lastLookY=0;
$('look').addEventListener('pointerdown',e=>{
 if(e.target.closest('#mobileSkills')||e.target.closest('#stick'))return;
 lookTouch=e.pointerId;lastLookX=e.clientX;lastLookY=e.clientY;
 $('look').setPointerCapture(e.pointerId);
});
$('look').addEventListener('pointermove',e=>{
 if(lookTouch!==e.pointerId||!running||paused)return;
 let dx=e.clientX-lastLookX,dy=e.clientY-lastLookY;
 lastLookX=e.clientX;lastLookY=e.clientY;
 yaw-=dx*.005;pitch-=dy*.005;
 pitch=Math.max(-1.35,Math.min(1.35,pitch));
 camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);
});
$('look').addEventListener('pointerup',()=>lookTouch=null);
$('look').addEventListener('pointercancel',()=>lookTouch=null);

window.addEventListener('contextmenu',e=>e.preventDefault());
updateHUD();
</script>
</body>
</html>
